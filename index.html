<script>window.AM = window.AM || {};
AM.sources = {"A":{"תרמה א":{"title":"סימן תרמה (דיני לולב), סעיף א","text":"נאמר בתורה (ויקרא כג מ), ולקחתם לכם ביום הראשון פרי עץ הדר כפות תמרים וענף עץ עבות וערבי נחל, ושמחתם לפני ה' אלהיכם שבעת ימים. וקבלו חז''ל מפי משה רבינו הלכה למשה מסיני, כי פרי עץ הדר, הוא האתרוג. כפות תמרים, זה לולב, והן חריות דקל שצמחו קודם שיתפרקו העלין שלהם לכאן ולכאן, אלא נמשכים לגובה שדרתו של הלולב כשרביט. וענף עץ עבות, הוא ההדס שעליו חופין את עצו. וערבי נחל, היא הערבה שעלה שלה משוך כנחל, ולא עגול, ומפני שרוב מין זה גדל על הנחלים, לכך נקרא ''ערבי נחל''. וארבעת המינים, מצותן שיהיו לולב אחד, אתרוג אחד, שלשה הדסים, ושתי ערבות. [ילקוט יוסף מועדים עמוד קנ. חזון עובדיה סוכות, עמוד שכח-של]"},"תרמה ב":{"title":"סימן תרמה (דיני לולב), סעיף ב","text":"מצוה להתעסק בהכנת הלולב ומיניו מיד לאחר יום הכפורים. ומכל מקום אין זה אלא להידור בעלמא, ויכול לקנות ארבעת המינים בערב יום טוב, כדי שלא יכמושו או יפסלו. ונכון ללמוד קודם החג הלכות ד' המינים, להיות בקי בהלכותיהן המרובות. [ילקו''י שם עמו' קעג]"},"תרמה ג":{"title":"סימן תרמה (דיני לולב), סעיף ג","text":"דרך הלולב כשיוצא מן הדקל יוצא כולו עץ אחד כחץ, ולאחר שגדל מעט נפתח, וכל מה שמוסיף לגדול נפתחים העלים יותר. [טור]. ומצוה מן המובחר ליטול לולב שהעלים שלו עולים עם שדרתו למעלה, כמו שרביט אחד, ואין העלים פרודים זה מזה כלל, ואינם נוטים לצדדים. ובדיעבד אם היו העלים פרודות זה מעל זה, אבל לא נעקרו ממנו, כשר, כל זמן שלא נתקשו העלים ומקום חיבורים כעץ, ואינם תלויים למטה אף בלא איגוד העלים לשדרה. ומכל מקום לכתחלה מצוה לאוגדו. נפרצו עליו, דהיינו שהעלים שלו נתדלדלו ואינם עולים עם השדרה שלו, אלא תלויים למטה, אף על פי שלא נעקרו מחיבורם, פסול. ואפילו אגד אותם עם השדרה אין זה הדר ופסול. וכל שכן אם נפרצו עליו ונעקרו ממקום חיבורם שפסול אפילו אם גם אגדם בשדרה. וכל זה הוא ברוב עלין, אבל אם הוא רק במיעוט עלין, ורוב העלים נשארו בחיבורם בשיעור הלולב, ונשאר הלולב מכוסה עם העלים שבו, כשר. [ש''ע סי' תרמה ס''ב ואחרונים. חזון עובדיה סוכות עמוד רצד]."},"תרמה ד":{"title":"סימן תרמה (דיני לולב), סעיף ד","text":"שיעור אורך הלולב ד' טפחים. והיינו שדרתו של הלולב מלבד העלים שבראש השדרה. ושיעור אורך ההדס והערבה שלשה טפחים, ולדעת כמה פוסקים ומרן הש''ע, שיעור זה אינו אלא באמה של חמשה טפחים, ולפי זה השלשה טפחים הם טפחיים ומחצה, שהם עשרה גודלים (20 ס''מ). ושיעור שדרו של לולב שלשה עשר גודלים ושליש גודל (דהיינו כ-27 ס''מ), אולם מכיון שיש פוסקים שחולקים ואומרים שהמדידה של ארבעת המינים היא באמה של ששה טפחים, כרגיל תמיד, יוצא איפוא שההדס והערבה שיעורם שנים עשר גודלים (שהם 24 ס''מ), ושדרו של הלולב ששה עשר גודלים (שהם 32 ס''מ), טוב להדר לכתחלה וליטול כשיעור המחמירים לצאת אליבא דכולי עלמא. [חזו''ע סוכות עמ' שסב]. ויש מחמירים ומצריכים שיהיה שיעור אורך שדרת הלולב ארבעים סנטימטר. אולם העיקר כמו שנתבאר. ומהיות טוב היכא דאפשר בנקל נכון לחוש לדעת החזו''א, ובפרט שמן ההידור הוא להוסיף על שיעורו שלא יהיה בצמצום. [חזו''ע שם. ילקו''י מועדים עמוד קנ]"},"תרמה ה":{"title":"סימן תרמה (דיני לולב), סעיף ה","text":"צריך שיצא טפח מהשדרה של הלולב מעל ראשי ההדסים והערבות, ולכן כשההדסים והערבות ארוכים יותר משיעורם, צריך שתהא גם השדרה ארוכה יותר, או שיחתוך את ההדסים והערבות מלמטה, שיהיו כשיעורם. [חזון עובדיה סוכות, עמוד שנט]"},"תרמה ו":{"title":"סימן תרמה (דיני לולב), סעיף ו","text":"לולב שיש בו רק ג' טפחים, אין לברך עליו אף בשעת הדחק, אלא כשאין לו לולב אחר יטלנו לנענוע בלי ברכה. [ילקוט יוסף מועדים עמוד קנט. ואמנם בברכי יוסף (סי' תרמט סק''ה) כתב בשם תשובת רבינו ישעיה מטראני, לולב שאין בגבהו אלא ג' טפחים, יכול לברך עליו במקום שאין אחר. אולם נראה דסב''ל ואין לברך עליו. וראה בחזו''ע סוכות עמ' שסב. וע''ע בספר בית השואבה דף קנט:]."},"תרמה ז":{"title":"סימן תרמה (דיני לולב), סעיף ז","text":"אין ללולב שיעור למעלה, ואפילו הוא ארוך ביותר כשר."},"תרמה ח":{"title":"סימן תרמה (דיני לולב), סעיף ח","text":"''כפות תמרים'' האמור בתורה, זה הלולב היוצא מן הדקל של תמרים, ומכל מקום גם לולבים הגדלים בדקלים שאינם מגדלים תמרים, כגון בדקל הקנרי שאינו עושה פירות, כשרים לברכה, ויוצאים בהם ידי חובת נטילת לולב, שדיבר הכתוב בהוה. [יחוה דעת ח''א סי' סז. ילקו''י מועדים עמוד קנ. וכ''ד החתם סופר (סוכה לד:), שו''ת בני ציון, שו''ת הר צבי, והחזו''א]."},"תרמה ט":{"title":"סימן תרמה (דיני לולב), סעיף ט","text":"לכתחלה לא ישהה הלולב וההדס והערבה במים במשך מעת לעת, שיש פוסלים אותם משום כבוש. אולם בדיעבד כשרים הם. [ילקו''י מועדים עמו' קנא. חזו''ע סוכות עמו' שסג]"},"תרמה י":{"title":"סימן תרמה (דיני לולב), סעיף י","text":"לולב שיבשו רוב עליו פסול, שאין זה הדר (סוכה כט:). ושיעור היובש משיכלה מראה הירקות שבו וילבינו פניו כפני המת, שזהו סימן שכלתה הלחלוחית שבו, ועל זה אמרו בירושלמי לא המתים יהללו יה. ואין דבר זה מצוי כיום. [ילקו''י מנוקד, חזו''ע סוכות עמו' רצו]"},"תרמה יא":{"title":"סימן תרמה (דיני לולב), סעיף יא","text":"יש מחמירים שלא יהיה בראשי העלים שום מראה אדום משריפת השמש. וכן נהג הגרי''ז מבריסק."},"תרמה יב":{"title":"סימן תרמה (דיני לולב), סעיף יב","text":"לולב שנקטם ראשו, דהיינו שנקטמו רוב העלין העליונים ברובם, פסול. ומה שמצוי היום שנקטם הקוץ הארוך והדק שבראש העלים, אין זה פוסל את הלולב. ואם אין אלא עלה אחד בראש שדרת הלולב, ונקטם, פסול. וכן אם נחלק העלה העליון עד השדרה, הוי נחלקה התיומת ופסול. ואם יש שם שני עלים בראש הלולב, ונחלקה התיומת של שניהם, פסול. במה דברים אמורים שנחלקו העלים בכל ארכם, או ברובם, אבל אם לא נחלק מהם אלא מקצתם, כשר. [כ''כ ה''ה. וכ''כ בשו''ת תרומת הדשן (סי' צו), ובספר לקט יושר (עמו' קמו), שראה לאחד מהגדולים שהיה נוהג להכשיר לולבים שהיו סדוקים בעלה האמצעי בראשיהם ברוחב אצבע ויותר. ע''ש. וע' בתוס' ב''ק (צו.) ד''ה נחלקה]. ואם נחלקה התיומת של העלה האחד, והעלה השני קיים עם התיומת שלו, כשר. (שד''ח מע' ד' המינים סי' ב אות ד). וטוב להדר שלא ליטול לולב שנחלק ממנו העלה העליון אפי' מקצתו, כדי שתהיה לקיחה תמה ושלימה. [עיקרי הד''ט. וכן נהג החזו''א]."},"תרמה יג":{"title":"סימן תרמה (דיני לולב), סעיף יג","text":"לולב שהיה כפוף בראשו פסול. ודוקא שהשדרה שלו כפופה, אבל אם העלים שבראשו כפופים, כמו שדרך להיות אצל לולבים רבים כשר. והרא''ש היה מעדיף לולב שעליו כפופים [הנקרא כפתור] ושדרתו ישרה. שאז בודאי שאין העלים שבו נחלקים ותיומתו קיימת. וכן המנהג להכשיר. [וכ''ד המאירי בשם חכמי נרבונא, ואף הרמב''ם לא כתב פיסול של כפוף כלל], ואמנם יש מהראשונים שהחמירו בזה, [כ''ד הריטב''א, והר''ן. וכתב בשו''ת הרדב''ז ח''ד (סי' רנט) דמה שאמרו בברייתא כפוף פסול היינו ראש העלה העליון. ואע''פ שהרא''ש והטור מכשירים בנכפפו העלין שבראשו, נכון להחמיר כסברא הראשונה]. ולכן יש מחמירים ואינם נוטלים לולב שראש העלה העליון כפוף בו אפילו משהו. ואם גוף העלים נכפף הרבה מאד לאמצעיתן ונראה כמו שנכפפו העלים לשנים, פסול, שאין זה הדר כלל. והוא הדין אם העלה העליון האמצעי שהיא התיומת נכפפה מאד לאמצעיתה פסול.[ש''ע הגר''ז. עפ''ד הר''ן. הב''ח ושע''ת]."},"תרמה יד":{"title":"סימן תרמה (דיני לולב), סעיף יד","text":"לולב שהוא עקום מלפניו, דהיינו הצד שכנגד השדרה ונעשה שדרתו כגב בעל חטוטרת, פסול. וכן אם נעקם לאחד מצדדיו, פסול, שאין זה הדר. אבל אם נעקם לאחוריו, שנעקם ונכפף לצד השדרה, כשר, שזו היא ברייתו. [ש''ע סי' תרמה ס''ח]. ואם חזר ויישר את הלולב העקום, על ידי מכבש, כשר. [הלק''ט ח''ב (ס''ס רכא). מועד לכל חי סי' כג אות צה]. ולכתחלה טוב ליזהר שהלולב לא יהיה עקום כלל, לצאת בו ידי חובה אליבא דכולי עלמא, [כי לדעת הר''ן עקום לאחריו פסול]. אבל היכא דלא אפשר יש להכשיר בנעקם לאחוריו, כיון שעינינו הרואות שכך ברייתו. הילכך אין להחמיר בזה. [חזו''ע סוכות, עמ' שא]."},"תרמה טו":{"title":"סימן תרמה (דיני לולב), סעיף טו","text":"בריית העלים של הלולב כשהם גדלים עמו, הם גדלים שנים שנים ודבוקים מן הגב שלהם, והגב של כל עלה המורכב משני עלין, נקרא תיומת, נחלקה התיומת ברוב העלים פסול. וכן אם היו רוב עליו אחת אחת מתחלת ברייתו, ולא היה שם תיומת פסול. וכן לולב שכל עליו (עם תיומת) כולם מצדו אחד, וצד השני ערום בלא עלים פסול. וטוב להדר לקחת לולב שמסתיים בעלה אחד כפול, וכשהוא דבוק בקליפה אדומה לשני העלים משני צדדיו. [כי לשיטת הט''ז בדעת הגאונים זהו הנקרא תיומת]. ולכן אין למשש לבדוק אם לא נחלקה התיומת [היינו גב העלים], כי על-ידי זה תיפרד הקליפה האדומה. [שדי חמד, ושכן מנהג הספרדים. אבל האשכנזים מפרידים בין העלים, שהרי לשיטתם הנענוע הוא בכשכוש]. ויכול לבדוק סוג הלולב אם עליו כפולים בעלים למטה בסוף השדרה. פחות מזה יקח לכתחלה לולב שיש בראשו ב' עלים דבוקים בקליפה אדומה. כי זהו הנקרא תיומת לפי הבית יוסף בדעת הגאונים. וכל זה להידור מצוה, אבל אם לא מצא דבוק בקליפה אדומה כשר לכתחלה לדעת מרן. וטוב שיקח לולב שאין התיומת [גב העלים] פרודה אפילו כל שהוא, כדי לצאת ידי חובת כל הדיעות. [ואם צריך התבוננות מרובה אם הוא פרוד, מצדד הגאון רבי עקיבא איגר שהוא כלא נפרד]. [ילקו''י מועדים מנוקד. וראה גם בחזו''ע סוכות, עמודים רצה, רצח]"},"תרמה טז":{"title":"סימן תרמה (דיני לולב), סעיף טז","text":"לולב שנסדקו עליו, אם נתרחקו שני סדקיו זה מזה עד שנראו כשנים, פסול. אך אם נפרדו ביניהם [באופן שלא נקרא נחלקה התיומת] אם נראה כאחד כשר. אבל אם נראה כשנים יש מחמירים בזה. ונחלקו הפוסקים אם מועיל להדביקו בדבק, וכשלא נפסל נראה דכשר לכולי עלמא להדביקו קודם שיסדק לגמרי. [חזו''ע סוכות, עמוד רצח]"},"תרמה יז":{"title":"סימן תרמה (דיני לולב), סעיף יז","text":"אין בלולב קדושת שביעית, ואפילו לולב של שנת השמיטה אין בו קדושת שביעית. [ילקוט יוסף השביעית והלכותיה עמוד תמ]."},"תרמה יח":{"title":"סימן תרמה (דיני לולב), סעיף יח","text":"לולב הגדל בעיר ירושלים, כשר למצות ארבעת המינים, ואע''פ שהרמב''ם (פ''ז מהל' בית הבחירה הל' יד) כתב, שאין נוטעים בירושלים גנות ופרדסים, ואינה נזרעת, אפילו הכי אין לחוש בזה למצוה הבאה בעבירה. דבזמן הזה שירושלים העתיקה חלקה נמצא ביד גוים ליכא לאיסור הנזכר ברמב''ם. [שו''ת הרדב''ז ח''ב (סי' תרלג). וראה בחזו''ע סוכות עמוד שכ]."},"תרמה יט":{"title":"סימן תרמה (דיני לולב), סעיף יט","text":"לולב הדס וערבה שנתנום תחת המטה, בשעה שישנו במטה, כיון דלא הוי מידי דמיכל אין שום פקפוק עליהם, וכשרים הם למצוה. [חזון עובדיה סוכות עמוד שכב]."},"תרמו א":{"title":"סימן תרמו (דיני הדס), סעיף א","text":"ענף עץ עבות האמור בתורה הוא ההדס המשולש, שענפיו חופים את עצו, שיהיו שלשה עלין בכל קן וקן, או יותר, בגבעול אחד, כלומר ששלשת העלים סמוכים זה לזה בשוה בעיגול אחד, ובשורה אחת, שאין עלה אחד נמוך או גבוה יותר מהשנים, אף על פי שכל אחד מהם מונח בעוקצו. אבל אם היו שני עלים בשורה אחת בשוה זה כנגד זה, והעלה השלישי למעלה מהם, או למטה מהם, אינו נקרא עבות, אלא נקרא הדס שוטה, ופסול למצות לולב. [סוכה לב: והרמב''ם פ''ז מלולב ה''ב. חזו''ע סוכות עמ' שג. ילקו''י מועדים עמ' קנא]"},"תרמו ב":{"title":"סימן תרמו (דיני הדס), סעיף ב","text":"הדס שיש לו שני עלים על גבי שני עלים, אין זה עבות ופסול למצות לולב. וגם מי שנמצא בעיר שאין שם הדס משולש, אלא הדס שוטה, אין לו לברך עליו כדי שלא לבטל מצות לולב. והנוהגים לברך על הדס שוטה לדעת מרן הבית יוסף אין להם על מה שיסמוכו, והדס בשני עלים על גבי שני עלים, אינו בכלל ענף עץ עבות, דהא לא קיימי תלתא בחד קינא. [ילקו''י מועדים עמוד קנא. חזון עובדיה סוכות עמוד דש. ושם תמה על רבינו הגרי''ח בעל הבן איש חי שפסק לברך על הדס כזה, והוא נגד מרן הבית יוסף בפשטות דבריו בב''י]."},"תרמו ג":{"title":"סימן תרמו (דיני הדס), סעיף ג","text":"שיעור אורך ההדס והערבה שלשה טפחים, ושדרו של הלולב ארבעה טפחים, ולדעת כמה פוסקים ומרן השלחן ערוך, שיעור זה אינו אלא באמה של חמשה טפחים, ולפי זה השלשה טפחים הם טפחיים ומחצה, שהם עשרה גודלים (20 ס''מ). ושיעור שדרו של לולב שלשה עשר גודלים ושליש גודל (דהיינו כ-27 ס''מ), אולם מכיון שיש פוסקים שחולקים ואומרים שהמדידה של ארבעת המינים היא באמה של ששה טפחים, כרגיל תמיד, יוצא איפוא שההדס והערבה שיעורם שנים עשר גודלים (שהם 24 ס''מ), ושדרו של הלולב ששה עשר גודלים (שהם 32 ס''מ), טוב להדר לכתחלה וליטול כשיעור המחמירים לצאת אליבא דכולי עלמא, וכמו שנתבאר לעיל. ויש מחמירים ומצריכים שיהיה שיעור אורך שדרת ההדס שלשים סנטימטר. אולם העיקר כמו שנתבאר. ומהיות טוב היכא דאפשר בנקל נכון לחוש לדעת החזו''א. [חזו''ע סוכות עמו' שסב. ילקו''י מועדים עמוד קנ]."},"תרמו ד":{"title":"סימן תרמו (דיני הדס), סעיף ד","text":"למצוה מן המובחר צריך שכל שיעור אורך ההדס (שהוא שנים עשר גודלין), יהיה משולש, שנקרא עבות, ולעיכובא ברובו. [הרא''ש בשם הראב''ד. וכ''פ מרן בש''ע סי' תרמו ס''ה). כלומר, שאם חלק מן העלים שלו, היו שנים שנים, או שנים ואחד על גביהם, אבל רוב השיעור של ההדס דהיינו כשבעה גודלין, היה משולש כראוי, די בכך, והוא כשר. וכן אם היה כולו משולש, ונשר ממנו עלה אחד מכל שלשה עלין, בחלק מן ההדס, ונשאר רוב שיעור ההדס, משולש כראוי, כשר. ואפילו בראשו אינו עבות וברובו הוא עבות כשר. אבל הידור מצוה שיהיה בראשו עבות. [ספר חיים וברכה]. אבל אם נשר עלה אחד מכל שלשה ברוב שיעור ההדס, יש מכשירים מכיון שעל כל פנים נשארו שנים מכל קן, רובו ככולו. [הרא''ה והריטב''א ורבינו ירוחם, ועיין בב''ח]. ויש פוסלים, שמכיון שלא נשאר עליו שם עבות כלל, שאין עבות אלא בשלושה, הילכך פסול. (הר''ן). והב''ח (סי' תרמו) הכריע כדברי המכשירים, וכתב, ודלא כמסקנת הר''ן שכתב שאין ראוי להקל בכך. ובשעת הדחק יש לסמוך על המקילים. [ילקו''י מועדים עמ' קנב. יחו''ד ח''ב סי' עג. חזו''ע שם עמ' שי]."},"תרמו ה":{"title":"סימן תרמו (דיני הדס), סעיף ה","text":"אם היה ההדס ארוך ביותר, אין צורך שיהיה רוב ארכו עבות, אלא צריך שרוב שיעור הכשר בהדס דהיינו שבעה גודלים, יהיה משולש, ודי בכך [הב''ח. ביאור הלכה]."},"תרמו ו":{"title":"סימן תרמו (דיני הדס), סעיף ו","text":"אם הוא עבות ברובו אבל לא במקום אחד, הפרי מגדים הסתפק בזה, ובביכורי יעקב מכשיר. [ילקוט יוסף מועדים מנוקד. חזון עובדיה סוכות, עמוד שי. ובספר כשרות ארבעת המינים להרב קליין כתב, שזו טעות בפמ''ג, ואף לפמ''ג כשר]."},"תרמו ז":{"title":"סימן תרמו (דיני הדס), סעיף ז","text":"שיעור גודל העלה צריך להיות כציפורן אגודל בזמנינו, שאם העלים גדולים משיעור זה ורחבים, יש בו חשש פיסול, שיש לחוש לדעת בה''ג דזה נקרא הדס שוטה, וראוי לחוש לדבריהם. וגם לא יהיו העלים קטנים יותר מדי. [ילקו''י מועדים עמ' קנב. חזו''ע סוכות עמו' שז]"},"תרמו ח":{"title":"סימן תרמו (דיני הדס), סעיף ח","text":"יש שפוסלים הדס שאין ענפיו חופין את כל עצו, שאין ראשו של העלה מגיע לעוקצו של העלה שלמעלה ממנו, [מור וקציעה]. ויש מכשירים. [כן מבואר בדברי רבינו ירוחם, וכן משמע במאירי. וכ''פ בחיים וברכה]. ועל כן מצוה מן המובחר ליטול הדס שענפיו חופים את כל עצו. ומכל מקום אפילו הדס שענפיו אין חופין את כל עצו, וראש העלה אינו מגיע לעוקצו של העלה שלמעלה ממנו, כשר, כי די שרוב עצו מחופה בענפיו, שרובו ככולו. והמחמיר תבוא עליו ברכה. [חזון עובדיה על סוכות, עמוד שה. ילקוט יוסף מועדים עמוד קנב]"},"תרמו ט":{"title":"סימן תרמו (דיני הדס), סעיף ט","text":"נקטם ראש ההדס (כלומר העץ שבראש בד ההדס), כשר. ולכתחלה יש להדר ליטול הדס שלם, שלא נקטם ראשו. אך במקום שיש דוחק בהדסים, יש להכשיר הדס שנקטם ראשו, שסברא זו עיקר. וכל שכן שיש להכשיר הדס שהעלה הראשון שלו נפל. [ילקו''י שם עמ' קנג. חזו''ע עמוד שח. ושכן דעת רוב הראשונים ומרן הש''ע דאף בנקטם העץ של ההדס כשר]."},"תרמו י":{"title":"סימן תרמו (דיני הדס), סעיף י","text":"ענפים ופארות קטנים שיוצאים בין קיני העלים של ההדס, טוב לקטום אותם שלא יפסיקו בין הקינים. [הראב''ד ובעל המאור והריטב''א. וכ''כ המהריק''ש בהגהותיו]. ובדיעבד שלא נקטמו ההדס כשר. [קרבן נתנאל. ספר בכורי יעקב (סי' תרמו סק''ב), ובשעה''צ אות לו, ובחזו''א סי' קמו אות ל]."},"תרמו יא":{"title":"סימן תרמו (דיני הדס), סעיף יא","text":"הדס שעלו בו כמין ענבים, אם היו ענביו ירוקות כמראה הדס, כשר. ואם היו אדומות או שחורות, והיו גם כן מרובות יותר מעליו, פסול. ומותר לכתחלה לתלוש מענביו השחורות מערב יום טוב, ולמעטם עד שיתרבו עליהם עלי ההדס, ואז יחזור ההדס להכשרו. אבל ביום טוב לכתחלה לא יתלשם כדי להכשירו, לפי שנראה כמתקן. ואם עבר ומיעטן ביום טוב, כשר."},"תרמו יב":{"title":"סימן תרמו (דיני הדס), סעיף יב","text":"אם נשרו מההדס עלים, כבר נתבאר לעיל [סעיף ד'] שבשעת הדחק כל שנשאר רוב בכל קן וקן דהיינו ב' עלים מתוך ג' כשר. והמחמיר תבוא עליו ברכה. ואם נשרו ב' עלים מכל קן, ברוב שיעור ההדס פסול לכולי עלמא. ולכן כל אדם ירא שמים לא יסמוך על דעתו להכשירם מבלי הכשר של מורה הוראה. [ילקו''י מועדים עמוד קנג. חזו''ע סוכות עמוד שי]"},"תרמו יג":{"title":"סימן תרמו (דיני הדס), סעיף יג","text":"אם נשרו העלים שבראש ההדס וראש הבד נראה מגולה, עדיף שלא לקטום את ראש ההדס בכדי שיהיה מכוסה בעלים, כי אף שלהלכה הדס הקטום כשר, מכל מקום כיון שדעת הראב''ד שפסול, יש לחוש לדבריו, וכמו שכתב הרב המגיד. ולכן עדיף שלא לקוטמו וישאר ראש הבד מגולה. [בית השואבה]. אבל אם ראש הבד כבר קטום והוא מגולה שאין העלים מכסין אותו [ואפילו חסר רק עלה אחד בראשו], נראה דפסול לכולי עלמא, שהרי קטימתו ניכרת. [שער הציון]. אבל החזון איש מפקפק בזה, ועדיף לקוטמו עד שיתכסה בעלין, שאז קטימתו לא תהא ניכרת ויהיה כשר לדעת מרן. וזה באופן שישאר בו שיעור ג' טפחים בבד ההדס. [בכורי יעקב. ילקוט יוסף מועדים מנוקד]."},"תרמו יד":{"title":"סימן תרמו (דיני הדס), סעיף יד","text":"הדס המורכב, נחלקו בו האחרונים. יש פוסלים ויש מכשירים. [היעב''ץ במור וקציעה (סי' תרמו) כתב להכשירם אם אין בהם שינוי מהדסים שאינם מורכבים. וכ''ד החכם צבי (סי' קסא). ומרן החיד''א, אבל השבות יעקב ח''א (סי' לו) חשש אפי' לספק מורכב. וכ''ד הגר''א]. ויש להחמיר לפוסלם. ובפרט דספק ברכות להקל. [כ''כ במחזיק ברכה (סי' תרמו סק''ה). והפמ''ג (סי' תרמט מש''ז סק''ג), ובספר בית השואבה (דף קז:) ובמשנ''ב (סי' תרמח ס''ק סה]. וכל זה בודאי מורכב, אבל בסתם הדסים, או בספק מורכבים, יש להכשיר. ולדברי החקלאים המומחים, הדסים שבשוק מסוג הדסים של צפת, אף על פי שנראים שונים קצת מן ההדסים הרגילים, אין זה מפני שהם מורכבים, אלא טבעם של הדסי צפת שאם נשתלים במקום אחר משנים את צורתם, שהכל תלוי באקלים של המקום, ולכן יש להכשירם. ואפילו לא יצאנו מידי ספק יש להכשירם. ואחזוקי איסורא לא מחזקינן. [חכם צבי. ילקו''י מועדים עמוד קנג. חזון עובדיה סוכות עמוד שיד]."},"תרמו טו":{"title":"סימן תרמו (דיני הדס), סעיף טו","text":"יבשו עליו פסול. ושיעור היבשות אפילו אם נפרך בציפורן אם עדיין הם ירוקים כשר. ואינם נקראים יבשים אלא כשילבינו פניהם אחר שיפרכו בציפורן. ואם יבשו רוב עליו ונשארו בראש כל בד משלשת הבדין קן אחד ובו שלשה עלים לחים כשר. [מרן בש''ע סי' תרמו סעיפים ו, ז, ח. משאת בנימין, ומג''א]."},"תרמו טז":{"title":"סימן תרמו (דיני הדס), סעיף טז","text":"פסולי הדס לא שנא יום טוב ראשון לשאר הימים. [תמים דעים]."},"תרמו יז":{"title":"סימן תרמו (דיני הדס), סעיף יז","text":"יש אומרים שיש קדושת שביעית בהדסים שגדלו בארץ ישראל, אם נטעום גם לשם ריח. ולכן הדסים שחנטו בשביעית המיועדים לחג הסוכות של השנה השמינית, יש בהם קדושת שביעית. ויש חולקים ואומרים שאין בהדס קדושת שביעית. וכן עיקר לדינא. ולכן מותר לקנות הדס לצורך מצות ארבעת המינים, ואין בזה איסור משום סחורה ומסירת דמי שביעית לעם הארץ. ואם חנט בששית לכולי עלמא אין בו קדושת שביעית. [ילקוט יוסף השביעית והלכותיה עמוד תמג. חזון עובדיה סוכות עמוד שטו]."},"תרמו יח":{"title":"סימן תרמו (דיני הדס), סעיף יח","text":"הדסים הבאים משדה של ישראל שעבדו בו בשביעית, והוא גם שמור, אף על פי כן יוצאים בהם ידי חובת מצות הדס. [ילקוט יוסף שביעית והלכותיה. ולהמבואר בסעיף הנ''ל כיון שאין בהם קדושה אם כן אין בהם איסור שמור]."},"תרמו יט":{"title":"סימן תרמו (דיני הדס), סעיף יט","text":"מותר להניח בשביעית את ההדסים במים כדי שלא יתייבשו, והוא הדין שמותר להניח פרחי נוי במים כדי שלא יכמושו, אף על פי שהם נפתחים במים. [ילקוט יוסף שביעית]."},"תרמז א":{"title":"סימן תרמז (דיני ערבה), סעיף א","text":"ערבי נחל האמור בתורה היא הערבה, שהוא מין ידוע שנקרא כן, ועלה שלה משוך כנחל, ולא עגול, ופיה חלק, וקנה שלה אדום. ואפילו אם עודנו ירוק כשר, דכל שאינו לבן סוף הקנה להאדים אחר שהשמש מכה בו. [ילקוט יוסף מועדים עמוד קנ, חזון עובדיה סוכות, עמוד שטז, שכט. רמב''ם פ''ז מהלכות לולב הלכה ד']"},"תרמז ב":{"title":"סימן תרמז (דיני ערבה), סעיף ב","text":"רוב הערבות גדלות על הנחלים, ולכך נקרא בתורה ''ערבי נחל''. ויש אומרים שלכן לכתחלה צריך לחזר אחר הגדלים על המים, ורק בדיעבד יוצא אף בגדל על ההרים. אולם דעת הרמב''ם והטור דאפילו גדל במדבר או בהרים כשר אף לכתחלה. ויש המהדרים ולוקחים ערבה הגדלה בנחל כדי לצאת ידי חובת כל הפוסקים. [חזון עובדיה סוכות, עמ' שכט]"},"תרמז ג":{"title":"סימן תרמז (דיני ערבה), סעיף ג","text":"יש מין הדומה לערבה, אלא שעלה שלו עגול, ופיו דומה למסור, וקנה שלו אינו אדום, אלא לבן, וזה המין נקרא צפצפה, ומין זה פסול ליטלו עם הלולב. אבל יש מין ערבה שאין פי העלה שלה חלק, ואינו כמסור אלא יש בו תלמים קטנים מאד, כמו פי מגל קטן מאד, ומין זה כשר למצוה. [חזון עובדיה סוכות עמ' שטז]"},"תרמז ד":{"title":"סימן תרמז (דיני ערבה), סעיף ד","text":"העלים של עלי האקליפטוס אינם כשרים למצות ערבה, מכיון שיש בהם ריח חזק ואינם ממין ערבה, ועוד, שרוב מין הערבה גדל על הנחלים. ועצי האקליפטוס אין עיקר גידולם על הנחל, ובודאי שאינם בכלל ערבי נחל, ופסולים הם למצות ערבה. [כ''כ בשו''ת הר צבי (חיו''ד ס''ס קפא). ובחזו''ע סוכות עמוד שיז]"},"תרמז ה":{"title":"סימן תרמז (דיני ערבה), סעיף ה","text":"יוצאים ידי חובת ערבה גם כשהערבה מצויה מאד, ואינה שוה פרוטה, ואע''פ שהנאה בפחות משוה פרוטה כמאן דליתא דמי, ואנן בעינן לכם בכל מין מארבעת המינים, עכ''פ ביום הראשון, שכל שהדבר שייך לו לבדו, לא משגחינן כלל אם הדבר שוה פרוטה, וגם חשיבות המצוה שיוצא בה יעדיף על השווי העצמי. [שערי דעה ח''ב (סי' ד). ובשו''ת מהר''ם שיק (חיו''ד סי' קנח). ובשו''ת מהרש''ם ח''ו (ס''ס ז). ובשו''ת חסד לאברהם (מה''ת סי' עו). ובשערי תשובה (סי' תפב).]."},"תרמז ו":{"title":"סימן תרמז (דיני ערבה), סעיף ו","text":"אתרוג או לולב וערבה שמוכר אותם נער שלא הגיע למצוות, שאין לו אב, ולא אפוטרופוס, והוברר לנו שבאו לידו כדין, ולדבריהם קנו אותם בזול, בכדי להרויח מהם, והם חריפים במשא ומתן, מותר לקנותם ממנו ולצאת בהם ידי חובה אף ביום טוב הראשון. [לכאורה תליא בפלוגתא אם קנין דרבנן מהני לשל תורה, שהפעוטות קונים מן התורה, כשיש דעת אחרת מקנה אותם, ואינם מקנים אלא מדרבנן, ובש''ע (סי' תרנח ס''ו) הובאה פלוגתא זו. וכתב בשו''ת פורת יוסף (סי' כו) בשם מהרי''מ מבריסק, שכבר הסכימו רוב האחרונים דקנין דרבנן מהני לדאורייתא. וראה במאור ישראל סוכה מו:]. ומכל מקום באופן שיש לחוש שהנערים האלה קטפו את הערבות שבידיהם, מאילני ערבה, ללא רשות הבעלים. ויכול להיות שקטפו אותם מאילן ערבה אשר בחצר של אביהם, והם סמוכים על שלחן אביהם, וזוכה בהן אביהם, כדתנן (ב''מ יב.). הנכון הוא שלא לקנות מהם ערבות למצוה. ומכל מקום במקום צורך גדול אם הוברר לנו שהוא קנאו כדת, מותר לקנות ממנו ולצאת בו ידי חובה גם ביום טוב הראשון. [מנחת יצחק ה, סה]."},"תרמז ז":{"title":"סימן תרמז (דיני ערבה), סעיף ז","text":"אף אם נשר מן הערבה העלה העליון שלה כשרה לכתחלה. והא דתנן נקטם ראשה פסולה היינו שנקטם העץ שבראש הבד, ולא קאי על העלין. [כ''כ בשו''ת גבעת שאול סי' עו]. ומכל מקום יש זהירים ומהדרים לקחת ערבה שיש בראשה לבלוב. אך אין הלבלוב לעיכובא, אלא חומרא בעלמא, והעיקר שראש העץ של עלה הערבה לא יקטם. ולכן כשהערבה ארוכה ורוצה לקצרה כדי שהלולב יהיה טופח על הערבה, או שרוצה לקצץ ממנה ולהעמידה על שלשה טפחים כדינה, יזהר שלא יקצץ מראש הערבה, אלא מלמטה במקום שהעלין מתחברין לענף. [ילקו''י מועדים עמו' קנד. חזו''ע סוכות סוף עמ' שיז. וכ''כ הגר''ז]."},"תרמז ח":{"title":"סימן תרמז (דיני ערבה), סעיף ח","text":"ערבה שיבשה ברוב עליה, והיינו שהלבינו פניה, או שנקטם ראשה, כלומר שנקטם ראש העץ שלה, שהעלים גדלים בו, פסולה. אבל אם נקטם העלה שבראשה כשרה. [דלא כהגאון החזון איש (סי' קמו אות ד) שפוסל. ראה בחזון עובדיה סוכות עמוד שיט]. ובשעת הדחק כשאין נמצא ערבה כשרה אלא ערבה שהלבינו פניה מרוב יובש, נוטל בלי ברכה. וכן בכל הפסולים בארבעת המינים, בשעת הדחק נוטל בלא ברכה. וערבה כמושה כשרה. [ילקו''י מועדים מנוקד. חזון עובדיה סוכות, עמוד רנו, שטז]"},"תרמז ט":{"title":"סימן תרמז (דיני ערבה), סעיף ט","text":"ערבה שנשרו רוב עליה, פסולה, בין שנשרו מאליהם, בין אם נשרו על ידי אדם. [חזו''ע סוכות עמ' שכד. שו''ת תמים דעים (ר''ס רלב). וכ''כ בדעת תורה להמהרש''ם (סי' תרמז) בשם דעת קדושים, שאם חסר מן העלים של הערבות מכל עלה רק מקצתו כשר. ודוקא אם חסר רוב עלה והוא ברוב העלים, פסולה. וה''ה בהדס]. אבל אם נשרו מקצת עליה, ונשאר רוב הבד של הערבה מגולה, נראה שאין לחוש לזה כלל. [ואף על פי שדעת בעל העיטור דאפילו לא נשאר אלא עלה אחד בבד אחד כשר, אין כן דעת רוב הפוסקים, ואין להכשיר בערבה שנשרו רוב עליה. חזו''ע סוכות עמוד שיח]. ואם נחסרו מן רוב העלים של הערבה, פסולה, והיינו רוב כל עלה ועלה. ויש לדקדק בזה שהדבר מצוי שהעלים נושרים על-ידי הנענוע. ובפרט בלולב של הקהל שיד הכל בו. ויש אומרים שאין להכשיר בנשרו מקצת העלים אלא בדיעבד, אבל לכתחלה לא יקח ערבה כזאת. ויש אומרים דכשרה אף לכתחלה. ואף שכן עיקר לדינא, מכל מקום כיון שהערבות מצויות לפיכך המחמיר בזה לכתחלה לקחת ערבה שלא נשרו עליה כלל, תבא עליו ברכה."},"תרמז י":{"title":"סימן תרמז (דיני ערבה), סעיף י","text":"שנה שהיתה גשומה והעלים של הערבה נמצאו מנוקבות בכמה נקבים, אין לפוסלם, והוא קל וחומר מלולב שאין נקב פוסל בו. [כ''כ בילקוט הגרשוני (סי' תרמז) בשם זכרון אברהם]."},"תרמז יא":{"title":"סימן תרמז (דיני ערבה), סעיף יא","text":"יש להדר שכל הלולב ומיניו ישארו לחים ורעננים בכל ימי החג, על ידי עטיפת הלולב ומיניו במטלית רטובה, וכיו''ב. [כדתנן (סוכה מב.) מקבלת אשה מיד בנה ומיד בעלה ומחזירתו למים וכו'. וכתב בספר יראים (מצוה קכד), מנהג טוב וכשר לתת הלולב והערבה במים, כדי שלא ייבשו]."},"תרמז יב":{"title":"סימן תרמז (דיני ערבה), סעיף יב","text":"טוב להדר להחליף בחול המועד את הערבה, ולקחת ערבה חדשה כל יום או יומיים. [רמ''א בדרכי משה (סי' תרנד) שנוהגים במקומותינו ליקח כל ימי חוה''מ ערבה חדשה, היכא דאפשר, למצוה מן המובחר]."},"תרמז יג":{"title":"סימן תרמז (דיני ערבה), סעיף יג","text":"לא יתחוב את הערבה בדוחק בתוך האגד שבלולב, שיש לחוש שלפעמים יהיו נושרים רוב עליה, אלא יקשרנה עם ההדסים בלולב. [אליה רבה סי' תרנא סק''ה]."},"תרמז יד":{"title":"סימן תרמז (דיני ערבה), סעיף יד","text":"ערבה שיוצאים מן הקנה שלה ענפים נוספים, אין צורך לקצצם. והיא כשרה כמות שהיא."},"תרמז טו":{"title":"סימן תרמז (דיני ערבה), סעיף טו","text":"ערבה שתלש אותה גוי ביום טוב הראשון של החג, והביאה לישראל, ואין לו ערבה אחרת, שפיר יוצא בה ידי חובת מצות נטילת לולב ביום הראשון שהוא מן התורה. ואף אם היה לו מערב יום טוב בד אחד של ערבה, [שלדעת הרמב''ן והראב''ן וראבי''ה והא''ח הלכה כר''ע, שאדם יוצא י''ח מה''ת, בבד אחד של ערבה]. והגוי תלש ביום טוב עוד ערבה, וברצונו לצרף מה שנתלשה ביום טוב לערבה המוכנה מערב יום טוב, רשאי לעשות כן, ואין איסור מוקצה מונעו מכך. והוא הדין לגבי שלשה בדי הדס. אבל גוי שתלש ערבה ביו''ט שני בחוץ לארץ אין יוצאים בה ידי חובה. (תשובת הרשב''א ח''א סי' רצז). אולם ערבה שתלש אותה ישראל בארץ ישראל ביום ראשון של חול המועד סוכות, אף תיירים שבאו מחו''ל ודעתם לחזור שעושים כאן יום טוב שני של גלויות, מותרים לקחת ממנה לצאת ידי חובה ביום טוב שני, בפרט כשאין להם ערבה אחרת. [שו''ת מנחת שלמה ח''ב סי' מה]."},"תרמז טז":{"title":"סימן תרמז (דיני ערבה), סעיף טז","text":"אף אם יש לו בד הדס משולש מערב יום טוב, מותר לומר לגוי לתלוש ביום טוב עוד שני הדסים מעציץ שאינו נקוב, דהוה ליה שבות דשבות במקום מצוה, שהתלישה מעציץ שאינו נקוב אינה אסורה אלא מדרבנן, ואמירה לגוי שבות, הוה ליה שבות דשבות במקום מצוה, ואף על פי שיש פוסקים כר' עקיבא דסגי בבד הדס אחד, על כל פנים בדיעבד, מכל מקום מותר לתלוש על ידי גוי, לקיים המצוה לכולי עלמא. [אגרות משה חאו''ח ח''ד סי' קכח]."},"תרמז יז":{"title":"סימן תרמז (דיני ערבה), סעיף יז","text":"יוצאים ידי חובה של ערבה והדס גם כאלו שגדלו בעציץ. [חזו''ע סוכות עמ' שכו]."},"תרמז יח":{"title":"סימן תרמז (דיני ערבה), סעיף יח","text":"ומכל מקום ארבעת המינים שגדלו בגידולי מים ראוי להחמיר שלא לצאת בהם ידי חובה. [שהרי לענין שביעית הזריעה במים בלבד מותרת. וכמו שפסק החזו''א, ה''ה לענין מצות ד' מינים שאינו יוצא י''ח בגידולי מים. ואע''פ שמדברי הרב קרן אורה יש לצדד שגם בגידולי מים יוצאים י''ח ארבעת המינים, וכן כתב בשו''ת שרגא המאיר ח''ז (ס''ס פה). מכל מקום הנכון לחוש שלא לצאת בהם י''ח]."},"תרמז יט":{"title":"סימן תרמז (דיני ערבה), סעיף יט","text":"בערבה אין קדושת שביעית, כיון שהיא רק לעצים, ואין בה ריח. [ילקו''י השביעית והלכותיה עמוד תמג]."},"תרמח א":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף א","text":"שיעור האתרוג הוא לפחות כביצה, אבל אתרוג שהוא פחות משיעור כביצה, פסול [שלחן ערוך סימן תרמח סעיף כב]. ואם הוא ארוך יותר מאורך כביצה, וברוחבו ועוביו הוא צר פחות מרוחב ביצה, ובסך הכל יש בו שיעור כביצה, כשר. [חזון עובדיה סוכות עמוד ערה. וראה עוד בילקוט יוסף על המועדים, עמוד קנד]."},"תרמח ב":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ב","text":"אתרוג שבשעה שנתלש מן האילן היה בו שיעור כביצה, ואחר כמה ימים נצטמק ועמד על פחות מכביצה, כשר, שכל שהיה בו שיעור כביצה וחל עליו שם גמר פרי, אפילו אם אחר כך נצטמק ועמד על שיעור פחות מכביצה, שוב לא נפקע ממנו שם פרי, ויוצאים בו ידי חובה. ולכן אתרוג שיש בו כביצה בצמצום, אך בודאי שבתוך ימי החג יצטמק, ובצר ליה שיעורא, יוצאים בו ידי חובה. [חזון עובדיה סוכות עמוד רעז]."},"תרמח ג":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ג","text":"אתרוג המורכב, לדעת רוב הפוסקים פסול לגמרי בין ביום הראשון בין בשאר ימי החג, ולדעתם הנוטלו ומברך עליו, לא יצא ידי חובתו וברכתו היא ברכה לבטלה, ואף על פי שיש קצת גדולים שכתבו להתיר לברך עליו בשעת הדחק, למעשה אין לסמוך עליהם. ולפיכך מצוה לפרסם ברבים שאין יוצאים ידי חובה באתרוגים מורכבים, ושהמברך עליהם ברכתו לבטלה. [ילקוט יוסף מועדים עמוד קנה. יבי''א ח''א סי' מב אות ט, יחו''ד ח''ב סי' עד]."},"תרמח ד":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ד","text":"הרואה את חבירו שנוטל אתרוג מורכב למצוה, יוכיח אותו במתק שפתים ובדרכי נועם ויודיענו שעל פי דעת רבותינו הפוסקים אסור לברך על אתרוג מורכב. וחייב לברך אך ורק על אתרוג בלתי מורכב. וכבר נאמר: הוכח לחכם ויאהבך. ולא יניחנו להמשיך בטעותו. ולמוכיחים ינעם ועליהם תבוא ברכת טוב. [חזו''ע על הלכות סוכות, ודלא כמו שנהג רב אחד (ב''תחומין'' עמוד שלה), שיש להמנע מלומר זאת לאדם תמים וע''ה שבירך על אתרוג מורכב. וכן לא יעשה]."},"תרמח ה":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ה","text":"הסימנים שנתנו גדולי האחרונים לאתרוג שאינו מורכב, אין לסמוך עליהם בזמן הזה, מפני שהחקלאים המומחים לנטיעת והרכבת האתרוגים התחכמו להצמיח אתרוגים מורכבים כדמותם וכצלמם של האתרוגים שאינם מורכבים, וצריך ליטול אתרוגים מפרדסים שהוחזקו האתרוגים שבהם שאינם מורכבים. [חזון עובדיה סוכות עמוד רכג]."},"תרמח ו":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ו","text":"סוחר אתרוגים שהוא ירא שמים, ואינו סוחר כלל באתרוגים מורכבים למצוה, נאמן להעיד שאתרוג זה אינו מורכב, ויוצאים בו ידי חובה לכתחלה ומברכים עליו. ובפרט אם יש לו תעודה מן הרבנות המקומית. ואמנם סוחר המוכר אתרוגים מורכבים למצוה, אינו נאמן להעיד על אתרוגים אחרים שהם בלתי מורכבים, אפילו יש בהם סימנים שאינם מורכבים, כדתנן (בבכורות לה.)''החשוד על הדבר לא דנו ולא מעידו''. [כן מצאתי כתוב בשם החזון איש]. ומה שכתבו איזה חכמים, שאין בעל הפרדס של האתרוגים נאמן לומר שהאתרוגים שלו אינם מורכבים, אף על פי שהוא אדם שבחזקת כשרות, ואפילו מעיד על זה עד כשר תלמיד חכם המוחזק בכשרות, אינו נאמן, דחיישינן שמא הוא מעיד באומד ומשמועה, כיון שיש חזקת חיוב המצוה, וחומר איסור ברכה לבטלה. נראה שהפריזו על המדה יותר מדאי, דכל שהוא מוחזק כירא שמים באמת, ומעיד שאתרוג זה אינו מורכב נאמן לומר שאתרוג זה אינו מורכב, וכשר למצוה. אלא שיש להזהר שלא לסמוך על עדות מפוקפקת של סתם סוחר שאין מטרתו אלא להרויח ממון, וכל שכן על עדות גוים, שאומרים שהפרדסים שלהם אינם מורכבים, אשר פיהם דיבר שוא וימינם ימין שקר. [יביע אומר ח''א סי' מב סק''ט. שו''ת יחוה דעת ח''ב סי' עד. ילקו''י מועדים עמוד קנה. חזון עובדיה סוכות שם]."},"תרמח ז":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ז","text":"סוחר המוכר אתרוגים למצוה, ובא אליו מי שאינו בקי בהלכה ואינו יודע שבאתרוג מורכב אין יוצאים ידי חובה, והסוחר מוציא לו אתרוג מורכב שהוא יפה ומהודר, ומוכרו לו, והלה נוטלו בחג לקיום המצוה, הסוחר עובר על איסור לפני עור לא תתן מכשול, שמלבד שהוא מונע ממנו לקיים מצות עשה של תורה, [שגם המונע מ''ע מחבירו עובר על איסור דלפני עור, כדמוכח בתוס' חולין (ד.) ד''ה מצת כותי]. הרי הוא גורם לו גם איסור ברכה לבטלה. וגם כשהלוקח שוגג, איכא איסור לפני עור. ומלבד זה יש לחשוש גם לאיסור לא תעשה דלא תונו איש את עמיתו ויראת מאלהיך. [ואף שיכול להשיג אתרוג מורכב במקום אחר, אפ''ה יש בדבר איסור תורה, שהרי גם הישראל האחר שימכור אתרוג מורכב עובר באיסור, ובאופן כזה לא מועיל מאי דקאי בעבר אחד דנהר. משנה למלך. מרן החיד''א. ועוד. וראה בחזו''ע סוכות עמוד רמב]."},"תרמח ח":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ח","text":"אודות מעשה שהיה, בזמן המלחמה בין ישראל לאויביה, נשלחה אניה עם כמאה אתרוגים מארץ ישראל לחו''ל, והאניה נקלעה בטעות לקהיר, והשלטונות שם החרימו את האתרוגים, ונתפרסם הדבר, והבעלים מסתמא התייאשו מהם, והוי יאוש עם שינוי רשות, ונסתפקו אם האתרוגים מורכבים או לא, ולא היתה אפשרות לברר הדבר, בשעת דחק גדולה כזו אפשר להורות לברך על אתרוגים אלה, אע''פ שבאותה עת היו רוב האתרוגים מארץ ישראל מורכבים. אולם שלא בעתות מלחמה, אין להקל בזה, בפרט שעתה נתרבו בארץ ישראל האתרוגים שאינם מורכבים, ויש לפרסם שהמברך על אתרוג מורכב הרי הוא נכנס בספק ברכה לבטלה, ומבטל מצות עשה. [חזון עובדיה סוכות עמוד רכח]."},"תרמח ט":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ט","text":"יש אילנות, ומהם עצי לימון, שבתוך פרחיהם יש אבקה, והדבורים המוצצות את צוף הפרחים מעבירות את אבקת פרחי הלימון אל פרחי האתרוג, ועל ידי כך מתפתח החלק המופרה בעץ האתרוג בצורה שונה. אולם אין לזה דין מורכב כלל, כי המורכב הוא כשמרכיב יחור מסוג אחד על אילן או על יחור מסוג אחר, שבכוחו של כל יחור בפני עצמו להצמיח, מה שאין כן אם מין מסויים אינו ראוי להצמיח בפני עצמו כמו אותה אבקה שבתוך הפרח שהדבורה מעבירה, הרי אין בשום פנים כח באבקה לבדה להצמיח, הילכך אין עליה שם ''מין'' אחר, והרכבתה עם האתרוג לא נחשבת הרכבת שני מינים. ולכן גם אם מזריקים לאילן האתרוג מיץ מלימון או תרכובת מתכונת הלימון אין על האתרוג הזה שם ''מורכב'', שמכיון שאותה זריקה או המיץ אין בכוחם להצמיח מצד עצמם, אין לאתרוג הגדל על ידם שם אתרוג המורכב, שאינו נחשב מורכב משני מינים, שלהרכיב דבר שאינו צומח בעצמו, אלא שהוא נבלע באילן ומטיב את צמיחתו, מותר. ולפי זה אם נזריק מיץ מלימון, לפרח האתרוג, או לאילן האתרוג, לא יהיה על אתרוג זה שם מורכב, שמאחר שאותה זריקה או המיץ אין בכחם להצמיח מצד עצמם, אין לאתרוג הגדל על ידם שם ''אתרוג מורכב'', מכיון שאינו מורכב משני מינים. [אלא שיש אומרים שלכתחלה יש איסור בהרכבת עצים, אפי' אם ההרכבה היא רק ע''י זריקה של מיץ, אע''פ שאילו היה זורע את המיץ באדמה, לא היה צומח כלל, כי סוף סוף השדה זרועה משני מינים. אך אין זה ברור לדינא. חזון עובדיה סוכות עמ' רלו]."},"תרמח י":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף י","text":"אתרוגי מרוקו שהם יפים ומהודרים מאד, רבני וגאוני מרוקו היו מברכים עליהם. והוזכרו לשבח בספר בכורי יעקב. והעידו עליהם גדולי רבני המערבים שהם כשרים ואינם מורכבים, ושכן נהגו מקדמת דנא גאוני מרוקו לברך עליהם על פי מסורת קדומה. ואף שנמצאו מערערים עליהם, מפני שלא נמצא בהם גרעינים, וגם מפני שהמיץ שבתוכם רב, כמו הלימון, וניכר שהם מורכבים. מכל מקום כבר כתבו להוכיח במישור שאתרוגי מרוקו אין עליהם חשש הרכבה כלל, ולא חלו בהם ידים, והחזקה והמסורת עליהם היא מדורי דורות שאינם מורכבים ושהם כשרים למצות ארבעת המינים, ושכן נהגו מאז ומעולם גאונים וצדיקים לברך עליהם. [חזון עובדיה סוכות עמוד רלח]."},"תרמח יא":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף יא","text":"אתרוג מהודר אינו פרי גדול ממש, ולא קטן ממש, אלא הבינוני, כי יפה הוא לעינים איש הבינים. [יפה ללב ח''ב אות ב]."},"תרמח יב":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף יב","text":"מי שאין לו אלא אתרוג ספק מורכב, אינו רשאי לברך עליו על נטילת לולב, שספק ברכות להקל, ואינו רשאי לברך אפילו בלשון בריך רחמנא מלכא דעלמא, שאף האומר דרך ברכה בריך רחמנא, על דעת לפטור את עצמו, הוי בכלל ברכה לבטלה, אלא יטול הלולב ומיניו בלי ברכה. ובשעת מלחמה וכדומה ראה לעיל סעיף ח'. [כ''כ הפמ''ג (סי' ריט סק''ג), שהמברך ''בריך רחמנא מלכא דעלמא'' חשיב נמי ברכה שא''צ. וכ''כ בשו''ת רעק''א (סי' כה). וכ''כ בספר בגדי ישע, ובשו''ת פרי תבואה, ובמכתב לחזקיהו, ובחתם סופר, והמהר''ם שיק, ובשו''ת אגרות משה, ובשו''ת יחוה דעת ח''ו (סי' טו), ובחזון עובדיה סוכות עמוד רמה]."},"תרמח יג":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף יג","text":"האתרוגים המצויים כיום (הקרויים אתרוג תימני) שאין בהם מדרך ברייתם הדד והשושנתא, אין ספק שיוצאים בהם ידי חובה לכתחלה, ומברכים על זה. ואם היה בהם הדד וניטל, פסול ביום הראשון. ואם יש ספק אם האתרוג גדל כך (בלי הדד) או שניטל, ואי אפשר כלל להכיר אם היה כן מתחלת ברייתו, אזלינן לקולא. [ילקוט יוסף מועדים, עמו' קנו]."},"תרמח יד":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף יד","text":"אתרוג שניטלה פיטמתו, והוא העץ שעל ראש האתרוג, ושושנתא עליו, פסול, משום שנידון כחסר. ואם ניטלה השושנתא בלבד, כשר. ודוקא שהיתה פיטמת, וניטלה, אבל אם לא היתה לו פיטמת מתחלת ברייתו כשר. ניטל עוקצו, והוא העץ שהאתרוג תלוי בו באילן, ונשאר במקומו גומא, פסול. [ז''ל הש''ע (סי' תרמח ס''ז), ניטל דדו, והוא הראש הקטן (העץ) ששושנתו בו פסול. ומשמע שדוקא אם ניטל הדד שמחוברת בו השושנתא, פסול, כיון שהוא נחשב מגוף האתרוג, אבל אם ניטלה השושנתא בלבד, כשר. וכ''כ הב''י לדעת הרי''ף והרמב''ם. ואף שהרמ''א בהגה כתב, שיש מחמירים אף בניטלה השושנתא, מ''מ אף הוא סיים, שלענין דינא אין לפסול אלא בניטל הדד דהיינו העץ שראש הפיטמא עליו, והראש נקרא שושנתא. וע''ע ביבי''א ח''ה סי' מב. ילקו''י מועדים עמוד קנז]."},"תרמח טו":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף טו","text":"מה שאמרו דאתרוג שניטלה פיטמתו פסול, הוא דוקא כשניטל הדד שהוא העץ אף מה שתקוע בתוך האתרוג, ונעשה שם כמין גומא, שאז פסול, אבל אם ניטל רק מה שלמעלה מגוף האתרוג אין להחמיר. לפיכך אם נשאר חלק מן העץ למעלה מן האתרוג כל שהוא אין להחמיר. [שגם מרן אינו פוסל אלא בנטילת גוף הדד הגבוה מן האתרוג, ובנטילתו נעשה שוה עם ראש האתרוג, אבל אם עדיין נשאר מקצת ממנו שהוא גבוה מגוף האתרוג, כגון שניטל עד חציו, מאן לימא לן דמרן פוסל כולי האי]. ואפילו ניטלה כל הפיטמא של האתרוג ולא נשאר ממנה רק גובה משהו באופן שמקצת ראש האתרוג מכוסה בעובי הפיטמא שנשתייר ממנה משהו, כמו שהיה מכוסה בתחלה כשהיתה הפיטמא שלימה, הרי זה כשר, ואין זה חסרון, דכל שלא ניטל לגמרי, אפילו ביום הראשון כשר. [חזו''ע סוכות עמ' רסג]."},"תרמח טז":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף טז","text":"אם בעוד האתרוג מחובר נפלה פיטמתו ממנו, מחמת שנתייבשה הליחות שבו, יש להכשירו, ולפעמים יש להכשיר האתרוג אף כשנושרת פיטמתו בתלוש, באופן שרואים שבעודו מחובר לעץ, כבר נתייבשה פיטמתו ביובש גמור, וכלתה ממנו ליחותו, שאז הוי כאילו נשרה פיטמתו במחובר, וכשר, כל שסיבת נפילתם מצד תכונתם הטבעית. ואין הבדל בזה באיזה שלב נפלו, מפני שכן דרכם של האתרוגים. ויש מי שכתב לחלק בזה בין אם נפלה הפיטמא במחובר בעודו קטן, או אם נפלה כשגדל. ולמעשה אין חילוק בזה, [וכבר נתבאר שבאתרוגים מהזרעים שהביאו לנו אחינו יוצאי תימן, אין להם פיטמת מתחלת ברייתן. אך כשרים הם בלי שום פקפוק כלל ועיקר]. [חזון עובדיה סוכות עמוד רסה]."},"תרמח יז":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף יז","text":"אם יש נקודות שחורות בעץ הפיטמת למעלה, או שינוי מראה אחר, כשר, שהרי אפילו נחסר לגמרי כשר. [כ''כ המהרש''ם בח''ז (סי' קסז). ואמנם בספר חיים וברכה כתב בשם המחצית השקל (ס''ס תרמח) להחמיר בזה. אך בספר מנחת פתים כתב שלפי מ''ש הרמ''א בס''ז, שאין לפסול אלא כשניטל הדד כולו עד בשר האתרוג, לפ''ז אפי' עלתה חזזית על עץ הדד, או יש בו נקודות שחורות, יש להכשיר. וראה בחזו''ע עמ' רסו]."},"תרמח יח":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף יח","text":"כבר נתבאר שאין שום פיסול בניטלה השושנתא, ומכל שכן כשהשושנתא קיימת ורק נחסר מקצתה, והאתרוג עצמו הוא מהודר, והבא לידו אתרוג כזה, והוא מניחו מידו בשביל השושנתא, ובוחר לו אתרוג אחר שאינו מהודר, עליו נאמר הכסיל בחושך הולך. [חזון עובדיה סוכות עמוד רסב]."},"תרמח יט":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף יט","text":"אתרוג שניטל עוקצו וחיברו על-ידי מחט, יש אומרים שיכול אף לברך על זה. ויש חולקים ואומרים דלא מהני חיבור על ידי אדם. [ילקו''י מועדים עמ' קנז. וע' בשו''ת בית יעקב (סי' קמב) שהתיר לחבר העוקץ באתרוג ע''י מחט, באופן שאינו ניכר, ורק יזהר שלא יעבור המחט לחדרי הזרע, אלא בעובי האתרוג. אך האחרונים דחו ראייתו, וכ''ה בשבות יעקב ח''א (סי' לה), ובפנים מאירות, וע' בחזו''ע סוכות שם]."},"תרמח כ":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כ","text":"אתרוג שניקב ועל ידי כך נחסר ממנו כל שהוא פסול. ואם יש ספק בדבר, אם נחסר ממנו כל שהוא, אם לאו, יש להכשירו ולברך עליו, אף ביום הראשון. [ילקו''י מועדים עמ' קנו. וז''ל מרן בש''ע (סי' תרמח ס''ב): ''אתרוג שניקב נקב מפולש כל שהוא פסול, ושאינו מפולש, אם היה כאיסר פסול, ואם חסר כל שהוא פסול, וי''א שגם בנקב מפולש בעינן חסרון משהו, ושאינו מפולש בחסרון כאיסר''. ונקטינן כסתם מרן, וכמו שפירש מרן בש''ע בס''ג, דמפולש היינו שניקב עד חדרי הזרע שהגרעינים בתוכו. וע''ע בחזו''ע סוכות עמו' רסח]."},"תרמח כא":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כא","text":"הא דאמרינן שאם חסר כל שהוא פסול, היינו דוקא כשנחסר מגוף האתרוג, אבל אם נחסר רק מהקליפה העליונה שהיא כמין גליד על האתרוג כשר לכולי עלמא. [כן כתב הרשב''א בתשובה (סי' נח), שאין נקרא חסרון אלא כשנחסר מבשר האתרוג שהוא הלבן שבו, אבל אם נחסר מקליפתו החיצונה אין זה חסרון. וכך קבלנוה. וכ''ה במשנה ברורה בביאור הלכה ס''ב]."},"תרמח כב":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כב","text":"יש מי שאומר שלא נקרא נקב אלא אם ניכר ונראה, אבל אם נקבו במחט דק, וליחותו מלאתו, עד שאינו ניכר כלל, כשר. [הרש''ש בסוכה לו. והסכים לדבריו בספר עמק סוכות שם]. ולא משמע כן מדברי בעל המנהיג. [חזון עובדיה סוכות עמוד רסט. וע''ש בעמוד ער ד''ה ונראה, והביאור בדבריו דחזי לצרף סברת הרש''ש לספק ספיקא, אבל לא שנסמוך לגמרי על סברת הרש''ש]."},"תרמח כג":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כג","text":"אין צריך לבדוק את האתרוג על ידי זכוכית מגדלת אם יש בו נקב, שכל נקב שאינו נראה לעין רגילה, אינו פוסל, וכן הדין לגבי כל חסרון הנראה באתרוג רק על ידי זכוכית מנגדלת. ומי שהוא קצר רואי ועל ידי המגדלת מגיע לראייה כמו בני אדם הרגילים, אין הכי נמי יבדוק על ידי זכוכית מגדלת. [שו''ת יביע אומר ח''ד (חיו''ד סי' כא אות ז'). ילקו''י מועדים עמוד קנו. ילקו''י מועדים עמוד קנו. וכיו''ב כתבו התפארת ישראל (במס' ע''ז פ''ב מ''ו בועז אות ג), ובערוך השלחן (סי' פד סעיף לו), ובאגרות משה חיו''ד ח''ב (סי' קמו). וכיו''ב כתב בשו''ת דובב מישרים ח''א (סי' א) לענין מוקף גויל בס''ת ותפלין ומזוזות. דאזלינן בתר חוש הראות הטבעי, ולא מהני ע''י זכוכית מגדלת. וע' בחזו''ע סוכות עמו' רע]."},"תרמח כה":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כה","text":"אם נתקע קוץ באתרוג עד חדרי הזרע, ולא נחסר ממנו מאומה, יש להכשיר מטעם ספק ספיקא, דשמא לא נקרא מפולש אלא מעבר לעבר, ושמא כל שאין בו חסרון כשר. [כן כתב בבכורי יעקב ס''ק יא]."},"תרמח כו":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כו","text":"אתרוג שהוא עגול ככדור, אף על פי שיש לו פיטמת ועוקץ, פסול. [סוכה לו. וטוש''ע סי' תרמח]."},"תרמח כז":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כז","text":"אתרוג שהוא עקום וכפוף כשר, דדוקא בלולב פסול. [תמים דעים להראב''ד. וכ''ה בב''י (סי' תרמה) בשם הרמב''ן, שיש בפיסולי לולב שלא נאמרו באתרוג, כגון אתרוג כפוף ועקום דומה למגל, בין שנעשה מעצמו, בין שגידלו כך בדפוס כשר. וכ''כ בשו''ת בית דוד (חאו''ח סי' תנא). וע' בחזו''ע סוכות עמוד רעט]."},"תרמח כח":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כח","text":"כל הפסולים, בשעת הדחק שלא נמצא כשרים, נוטלים אותם בלא ברכה. ואף ברכת שהחיינו אין לברך. כי ברכת שהחיינו תלויה בברכת המצוה, וכל שאינו מברך ברכת המצוה אינו מברך שהחיינו. ובכל שאר ימי חג הסוכות (חוץ מיום ראשון), הואיל ומצות נטילת לולב ומיניו בהם אינה אלא מדרבנן, התירו בהם כמה פיסולים שבאתרוג ובלולב, וכמו שפסק הרמב''ם (פ''ח מהל' לולב ה''ט) בזה''ל: ''כל אלו שאמרנו שהם פסולים, מפני מומים שביארנו, או מפני גזל וגניבה, וכן שאול או חסר, אינם אלא ביום הראשון בלבד, אבל ביום טוב שני עם שאר הימים הכל כשרים. והפיסול שהוא משום עבודה זרה, או מפני שהאתרוג אסור באכילה, פסולים כל שבעת הימים''. וכן פסק מרן בשלחן ערוך (סי' תרמט ס''ה). וכן עיקר. וכן כל שפיסולו מטעם ''הדר'', אינו פוסל אלא ביום טוב הראשון, אבל בשאר הימים כשר. ונוטל הלולב ומברך. ואף על פי שיש פוסלים, וכן פסק הרמ''א, וקיימא לן ספק ברכות להקל, שאני הכא שהמחלוקת במצוה ולא בברכה, ובכל כיוצא בזה שמרן פסק להכשיר ואיכא חזקת חיוב, ברוכי נמי מברכינן. [ילקו''י מועדים עמ' קנז. יביע אומר ח''י סי' מח עמוד פב. חזו''ע סוכות עמוד רפג]"},"תרמח כט":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף כט","text":"הדס שענביו מרובות מעליו, לדעת מרן השלחן ערוך אינו נחשב כענף עץ, אלא פרי, ואין יוצאים בו ידי חובה. ובימי חול המועד יש בידו תקנה למעטן, ולהסיר הענבים ולהכשירם אליבא דכולי עלמא. [חזון עובדיה סוכות עמוד רפג בהערה ד''ה והדס]."},"תרמח ל":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ל","text":"כל הפסולים ביום טוב ראשון, כגון חסר וכיוצא בזה, פסולים אף ביום טוב שני של גלויות, וכשאין לו אחר נוטלו בלא ברכה. וכשאין הפיסול באתרוג בגדר ודאי, אלא יש ספק אם האתרוג כשר או לא, אפשר גם לברך ביום טוב שני, מכח ספק ספיקא. ומועיל ספק ספיקא כשהספק במצוה ולא בברכה, ויש חזקת חיוב. [חזו''ע סוכות עמוד רפה. ואף שדעת הרמב''ם הנ''ל שדין יו''ט שני כדין שאר הימים, מ''מ דעת הרא''ש דיו''ט שני כדין יו''ט ראשון. ומרן פסק לחוש לדעת הרא''ש מכח סב''ל. ואם יש ספק בפיסולו, הו''ל ס''ס, וברוכי נמי מברכינן]."},"תרמח לא":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לא","text":"אתרוג שבא מעיר ''הונג קונג'', והוא כמו אתרוג רגיל בצורתו ובסימניו, רק שיש בו שינוי, שמחצי האתרוג ומעלה עולה בו כמין אצבעות ממין האתרוג עצמו, והם כעשר או ט''ו אצבעות מהם ארוכים מהם קצרים, אתרוג זה אין לו היתר כלל, מפני שאין בו קבלה שהוא באמת אתרוג, אף על פי שיש בו סימני אתרוג, והוא כמו פרי האילן ''דבדב'' שיש בו סימני אתרוג, ותוארו כמין אתרוג ממש, ועם כל זה קבלה בידינו שאין זה אתרוג. [בשו''ת זבחי צדק (חאו''ח סי' לז) צידד להקל בזה, אך הגרי''ח בתשובה שם שדי ביה נרגא, והעלה שאתרוג זה אין לו היתר כלל. וראה בחזון עובדיה סוכות שם]."},"תרמח לב":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לב","text":"ישתדל אדם שהאתרוג יהיה בצבע צהוב, שזה המהודר ביותר. ואם היה ירוק חזק כעשבי השדה, פסול. ואם ידוע שאם משהין אותו מעט בסמוך לפירות שצבעם צהוב חוזר למראה אתרוג, כשר לנטילה אף בעודו ירוק. וכן פשט המנהג לברך על אתרוג כזה. ולכן נכון להצהיב אתרוג ירוק באמצעות תפוחים צהובים, שהאתרוג שואב מהם, ואין בזה כל חשש בהלכה. אך ירחיק התפוחים מעט מהעוקץ של האתרוג, ויהפכנו לצד הפיטמא, שאם לא יעשה כן עלול העוקץ ליפול. [ילקו''י מועדים עמוד קנז. חזו''ע סוכות, עמוד רנו]"},"תרמח לג":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לג","text":"מה שיש נוהגים לתת כמה תפוחי עץ בסמוך לאתרוג כדי להצהיבו, נראה שאין איסור לתת בשבת תפוחי עץ ליד האתרוג להצהיבו, שאף בלא נתינת התפוחים, דרך האתרוגים שלנו להצהיב מאליהם, ואינו אלא כמוסיף להחיש להצהיבו. [ואף שהאתרוג עומד למצוה, מ''מ לא פקע ממנו שם אוכל, ובפרט אם בדעתו לאכול ממנו אחר החג, והוי בכלל מאי דקי''ל אין צביעה באוכלין]."},"תרמח לד":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לד","text":"אתרוג שהוא מנומר בצבע שחור או לבן או ירוק ככרתי, במקום אחד שבו, פוסל ברובו, ובשנים או בשלשה מקומות נפסל אף במיעוטו. אבל מנומר מגוון שהוא ממין האתרוג, כגון חלמון ביצה או אדום בהיר, כשר. [כ''כ הראב''ד, והרא''ה, והמאירי, והריטב''א, וכן נראה דעת מרן הש''ע, וכמ''ש בשעה''צ (אות סב). וז''ל מרן בש''ע (סי' תרמח סט''ז): אם יש באתרוג במקום אחד מראה שחור או לבן, פוסל ברובו, ואם בשנים ושלשה מקומות, דינו כחזזית להפסל אפי' במיעוטו. וראה בחזון עובדיה סוכות עמוד רנח]."},"תרמח לה":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לה","text":"לפיכך אתרוג שהיה ירוק כעשבי השדה, שנתנו אותו על ידי תפוחי עץ והתחיל חלק ממנו להצהיב, והחלק האחר נשאר ירוק, אין זה נחשב מנומר, ובפרט שקרוב לודאי שבעוד איזה ימים יהפך מראה האתרוג כולו לצהוב. [ואף שהרב בכורי יעקב (ס''ק מד) מחמיר בזה, אין זה אלא לשיטת הפוסלים בכל ענין, אבל אנן בדידן נקטינן כרוב הראשונים ומרן הש''ע דסבירא להו להכשיר. וברוכי נמי מברכינן עליו, כי המחלוקת במצוה ולא בברכה. וראה בחזו''ע סוכות עמ' רנח]."},"תרמח לו":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לו","text":"האתרוגים המצויים בינינו, שלפעמים נמצא בהם מראה אדום, שמירקותו נהפך אל מראה אדום והוא מתפשט על פני רוב שטח האתרוג, או על חוטמו, יש שפוסלים אותם, לפי שמראה זה לא שמענו שיהא מראה אתרוג, כיון שהוא נוטה אל מראה אדום. ויש שמכשירים אתרוג זה, שאין לנו לפסול אתרוג שיש בו מראה אדום, ולא הקפידו רבותינו על שינוי מראה אלא אם כן אינו הדר, וכפי חכמתם קבעו שהלבן והשחור באתרוג אינם מהודרים, ולכן פסלוהו, אבל מראה אדום שלא הזכירוהו בדבריהם לפסול, כשר. ועל כל פנים אם דרך אתרוג להיות כך כשר. [בשו''ת פני אריה (סי' ה) העלה להכשירם. ובדין מראה אדום בהיר באתרוג, הנה אם דרך האתרוג להיות כך מותר. והפמ''ג (סי' תרמח א''א אות יח וכד) ס''ל שאדום ממש פסול, כי מראה אתרוג הוא כחלמון ביצה. וע' בחזון עובדיה על סוכות עמוד רנט]."},"תרמח לז":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לז","text":"אתרוג שעלתה עליו חזזית, [חזזית, פירש רש''י כמין אבעבועות, ואפילו באבעבוע אחד הדין כן], אם בשנים או בשלשה מקומות, אפילו כולם מצד אחד של האתרוג, פסול. ואם רק במקום אחד, אינו פסול אלא אם כן נתפשטה החזזית על רובו. ומיהו אם החזזית על חוטמו, [היינו במקום שמתחיל לשפע כלפי מעלה, עד הפיטמא], אפילו כל שהוא פסול. [והחוטם מתחיל באתרוג אחר שיעור רובו של האתרוג]. והוא הדין לכל הפיסולים, כגון כתם כושי לבן, שפוסלים בחוטמו בכל שהוא. וכל זה ביום טוב ראשון, אבל בשאר הימים אין חזזית פוסלת לדעת מרן. [ראה בש''ע סי' תרמח ס''ט, ובחזו''ע סוכות עמוד רסא]."},"תרמח לח":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לח","text":"אתרוג שעלתה בו חזזית, וכשקולפו חוזר למראה אתרוג, כשר. ויש מי שכתב שיש להכשירו על ידי כך אפילו לכתחלה. אך למעשה אין לנו לסמוך על זה, שמכיון שמבואר במשנה ברורה שקליפה עליונה זו אינה אלא כגליד דק מאד, אין אנו בקיאים היום בזה, וחיישינן אפילו בסריטה קלה שמא יחסר האתרוג ויפסל בכך. [משנה ברורה ס''ק נב]."},"תרמח לט":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף לט","text":"מה שמצוי באתרוגים, בימי חול המועד, שנוצר על האתרוג נימורים, מכח משמוש ידים ורוב נענועים, ונעשים מקומות מנומרים, וספק אם הוא ממראה אתרוג, כי אי אפשר שתמיד יהיה מראה אתרוג באותם הכתמים והבהרות שנולדו מזיעת הידים, לדעת מרן השלחן ערוך ודאי דמכשרינן באופן כזה. אבל לדעת הרמ''א שפוסל כל שבעה בחזזית וכיו''ב, יש שכתבו להחמיר בזה. ודעת החתם סופר להכשיר אתרוג כזה. ואכתי הוי הדר, כיון שבאו על ידי מצותו, וזהו הודו והדרו. והסומך על דברי החתם סופר לא הפסיד, ויש לו על מה שיסמוך. [ראה בחת''ס בסוכה (לו.), ובספר ישיב משה (עמ' פג), ובחזו''ע סוכות עמוד רנט.]."},"תרמח מ":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מ","text":"מה שמצוי באתרוגים להיות בהם נקודות קטנות, אינם בכלל גרב או ילפת, כי גרב נעשה מעצמות האתרוג, אבל אלו נעשים על ידי קוצים וברקנים שבאילן האתרוג, שעוקצים אותו, וכשהוא גדל באילן נעשה מקום העקיצה כמו אדום, ואינו אלא מצד העקיצה, וכשר. שכל מה שנעקץ האתרוג על ידי קוצים, אין באתרוג שום עיפוש, הילכך אין זו חזזית וכשר. [חזון עובדיה סוכות עמוד רסא]."},"תרמח מא":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מא","text":"אתרוג שיש עליו כעין קרום דק בחוטמו, וכן בשאר המקומות, ואומרים שזה נגרם מהעלים הנוגעים באתרוגים, יש להקל לברך עליהם ולצאת בהם ידי חובה, ואין בזה משום חזזית. [חזון עובדיה סוכות, עמוד רס]"},"תרמח מב":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מב","text":"אתרוג היבש פסול, ושיעור היבשות כשאינו מוציא שום ליחה, וסתם אתרוג שהוא משנה שעברה, יבש הוא, ופסול. ואם הונח במקרר במשך כל השנה ורואים שלא נס ליחו, יש להכשירו. [חזון עובדיה סוכות עמוד רנה]."},"תרמח מג":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מג","text":"אתרוג תפוח וסרוח שנימוח כל בשרו בפנים, וקליפתו קיימת, נקטינן להחמיר. [ש''ע]"},"תרמח מד":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מד","text":"האתרוג שניטל למצוה, חייבים להפריש עליו תרומות ומעשרות (מאתרוג אחר), כדי שיהיה מותר וראוי לאכילה. וכמו שנאמר ולקחתם ''לכם'', שיהיה בו היתר אכילה, (סוכה לה.), אבל אתרוג שלא הופרשו עליו תרומות ומעשרות הרי הוא טבל, ופסול למצוה. [ילקוט יוסף מועדים עמוד קנז, ילקו''י על הלכות ערלה פ''ט ס''א, עמוד תקכה. חזון עובדיה סוכות עמוד רמו]."},"תרמח מה":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מה","text":"אפילו אתרוגים הגדלים בפרדסים של גוים, אם ישראל קוצץ אותם נחשב גמר מלאכתו על ידי ישראל וחייב בתרומות ומעשרות בלא ברכה. (ורק אם קצצם גוי פטורים מתרומות ומעשרות). ולכן לכתחלה יש להזהר שישראל הקוצץ אתרוגים מפרדסי אתרוגים (של עכו''ם), יפריש תרומות ומעשרות עליהם לצאת ידי חובת כל הפוסקים, אך בדיעבד אם שכח להפריש תרומות ומעשרות, ונזכר רק ביום טוב [שאז אין מפרישים תרומות ומעשרות ביום טוב], יסמוך על דברי מהרשד''ם והאחרונים שעמו, ויכול ליטלו ביום טוב ויברך עליו. [ילקוט יוסף מועדים שם. חזון עובדיה סוכות עמוד רמו-ורנא]."},"תרמח מו":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מו","text":"מי שאין לו אתרוג אלא אתרוג של טבל, שלא הפרישו ממנו תרומות ומעשרות, אף על פי שיש אומרים שכשר אפילו ביום הראשון, דלכם קרינן ביה, הואיל ויכול להפריש עליו מאתרוג אחר, מכל מקום רבו החולקים על סברא זו, ופוסלים אפילו בדיעבד אתרוג טבל. ולכן כשאין לו אלא אתרוג טבל, יטלנו בלא ברכה. וכשימצא אתרוג אחר במשך היום, יחזור ויטלנו בלא ברכה. [בסוכה (לד:) משמע שאתרוג של טבל פסול למצוה, דלא קרינן ביה ''לכם''. וכ''פ הרמב''ם. וכן נראה דעת מרן בש''ע (סי' תרמט ס''ה). אלא שדעת הרמב''ן והריטב''א שאף אתרוג של טבל לכם קרינן ביה, כיון שיכול לסלק הכהן והלוי באתרוג דעלמא שיפריש על האתרוג הזה. וראה בילקו''י על הלכות ערלה פ''ט. ובילקו''י מועדים עמ' קנז, ובמהדורת תשס''ד עמ' תרסה. ובחזו''ע סוכות עמ' רמט]."},"תרמח מז":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מז","text":"ישראל שבא לפרדס אתרוגים של נכרי, וברשותו קצץ כמה אתרוגים, ולישראל יש שכיר גוי, אשר גם הוא קצץ כמה אתרוגים מהפרדס ההוא, ונתערבו כל האתרוגים, ואם יפריש מהם תרומות ומעשרות לתקנם, קיים חשש שמא הוא מפריש מן הפיטור על החיוב, כי מה שקצץ הישראל הוי טבל וחייב בתרומות ומעשרות, ומה שקצץ הגוי לא נתחייבו בתרומות ומעשרות, העיקר לדינא שמועיל להפריש תרומות ומעשרות, והאתרוגים כשרים למצוה. [שו''ת אמרי בינה ח''א (סי' יא), משום ספק ספיקא, דשמא גם מה שקצץ הישראל פטורים מתרו''מ, כיון שקצצם לשם מצוה, ושמא הפריש מן החיוב על החיוב. ועוד, לפי מ''ש מרן הכס''מ, שישראל שקנה תבואה מן השדה של נכרי, ומירחם נכרי בשביל ישראל, חייב בתרו''מ, ששלוחו של אדם כמותו, ולפ''ז גם מה שקצץ שכירו הגוי חייב בתרו''מ, ובפרט לפמ''ש המחנה אפרים שיד פועל כיד בעה''ב, וכאילו הוא עצמו עשאו. הילכך מפריש תרו''מ מהם ובהם, ואין לחוש לשמא מפריש מן הפיטור על החיוב. וראה בחזו''ע סוכות עמוד רנא]."},"תרמח מח":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מח","text":"מותר לתרום ולעשר מאתרוג המורכב על אתרוג שאינו מורכב. [חזון איש (כלאים סי' ג אות ז), שמכיון שלענין כלאים מותר להרכיב אתרוג המורכב באתרוג שאינו מורכב, מפני שהפירות של שניהם דומים דמיון גמור, כך הדין לענין תרו''מ, שמותר לתרום ולעשר מן המורכב על שאינו מורכב]."},"תרמח מט":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף מט","text":"אתרוג של ערלה, שהוא אסור באכילה ובהנאה, פסול. ואפילו אם נטעוהו לשם מצוה, פסול. שאף הנוטע אילן לשם מצוה, יש בו דין ערלה. [ילקו''י מועדים, מהדורת תשס''ד עמוד תרס, ילקו''י על הלכות ערלה פ''ט. שוב יצא לאור חזון עובדיה סוכות, ושם (עמוד רנב) כתב כדברינו]. ויש מי שכתב דהא דאמרינן אתרוג שנטעו למצותו חייב בערלה, היינו שאם בא לאוכלו אסור, אבל רשאי הוא לצאת בו ידי חובה אפילו ביום טוב ראשון. אך אין דבריו נכונים, שמאחר והאתרוג הזה אסור באכילה לא יתכן להתירו למצותו, שאין בו היתר אכילה, ולא חשיב לכם [בספר פתח הדביר ח''ג (סי' רסד סק''ג) הביא מ''ש מהר''א ליב, דהא דאמרינן אתרוג שנטעו למצותו חייב בערלה, דהיינו שאם בא לאוכלו אסור, אבל רשאי הוא לצאת בו ידי חובה אפילו בימים הראשונים של החג, ותמה עליו, שכיון שהוא מודה שהאתרוג הזה אסור באכילה אם כן איך יתכן להתירו למצותו, והרי אין בו היתר אכילה, ולא חשיב לכם. וראה בחזון עובדיה על סוכות עמוד רנב, ובילקו''י על הלכות ערלה פרק ט']."},"תרמח נ":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נ","text":"אם נתערב אתרוג אחד של ערלה באתרוג כשר הראוי לאכילה, ואינו ניכר מי מהם האתרוג הכשר, יש אומרים שיוצא ידי חובה כשיטול אותם בזה אחר זה, דקמי שמיא גליא מי הוא הכשר לאכילה וראוי לצאת בו ידי חובה, ומי הוא האסור מן התורה. ויש אומרים שאין יוצאים י''ח בזה, מכיון ששניהם אסורים באכילה, מדרבנן. וראוי להחמיר כדבריהם. וכל שכן שאסור לו לברך על זה. אך אם אין לו אתרוג אחר, יקח את שניהם בלא ברכה, ויכוין שיוצא ידי חובה באתרוג הכשר לנטילה. ובמשך היום אם ימצא אתרוג כשר אחר, יטול אותו. [ילקו''י מועדים עמ' קנח. חזו''ע סוכות עמוד רנב]."},"תרמח נא":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נא","text":"אתרוג של ערלה של חוץ לארץ, יש אומרים דכשר למצות ארבעת המינים אם אין לו אתרוג אחר. אך דעת רבינו ישעיה הראשון, שאף אתרוג של ערלה בחוץ לארץ פסול, ולכן לכתחלה יש לחוש לדבריו להחמיר. ורק אם אין לו אתרוג אחר יטלנו בלא ברכה, וכאשר ימצא אתרוג אחר כשר, יחזור ויטלנו בלי ברכה. [כן נראה דעת מרן הב''י. ודלא כמו שפסק בפשיטות המשנה ברורה (סי' תרמט ס''ק מה) שאתרוג של ערלה בחו''ל כשר. ע''ש]."},"תרמח נב":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נב","text":"אתרוגי ארץ ישראל, לכתחלה יש לקנות מאדם ירא שמים ונאמן, או מפרדס שיש עליו הכשר של רבנים, המעידים שאין באתרוגים חשש ערלה. אולם מעיקר הדין הקונה אתרוג, אינו צריך לחוש שמא הוא מערלה, אחר שרוב ככל האתרוגים בארץ אינם בגדר ספק ערלה, ואמרינן בזה דכל דפריש מרובא פריש. והמחמיר על עצמו לברר, היכא דאפשר לברר בנקל, אם האתרוג הוא ערלה או לא, תבוא עליו ברכה. [והדבר ברור שעל בעלי הפרדסים של האתרוגים ליזהר בזה שלא לשווק אתרוגי ערלה אף שהם לצורך מצוה]. [ילקו''י הלכות ערלה, פ''ט הערה ב'. וילקו''י מועדים עמ' תרסב. חזו''ע סוכות עמ' רנד. וכן העלה ביבי''א ח''ו (חיו''ד סי' כד). וכ''כ בשו''ת הרדב''ז ח''א (סי' תקפ), שיפה עשו חכמי א''י שאין חוששים לספק ערלה, וכן ראיתי לזקני וחסידי הדור שלא היו נזהרים בזה, ואותם שנהגו פרישות זה, קרוב אצלי שהם חוטאים על נפשם ק''ו מנזיר וכו'. כללא דמילתא דמן הנמכר בשוק אין כאן בית מיחוש]."},"תרמח נג":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נג","text":"אתרוג שריססוהו הפרדסנים בחומרים רעילים, ועל פי הוראת משרד הבריאות, אסור לאכול פרי כזה עד לאחר שלשים יום, (וכנראה שאף שטיפה במים לא תועיל לו), העיקר לדינא שיוצאים בו ידי חובה, ולא דמי לאתרוג של טבל ושל ערלה, שאין בהם היתר אכילה. [הנה לפי מ''ש השעה''מ (הל' לולב פ''ז ה''ב) דהא דכתיב ''לכם'' שיהא ראוי לאכילה, לא קפיד קרא שיהיה ראוי ביו''ט עצמו, אלא שיהיה ראוי לאכילה באיזה זמן שיהיה, נמצא דכל שהאתרוג יחזור להיות ראוי לאכילה כעבור ל' יום מיום הריסוס, כשר למצוה, כי זמן ממילא קא אתי]."},"תרמח נד":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נד","text":"בהיות ובעץ האתרוג יש בו קוצים, לפיכך יש הזורעים אותו לשם גדר וסייג, ובזה כל האתרוגים הגדלים בעץ זה אין נוהג בהם דין ערלה, ומותר לקחת אתרוגים אלה לשם מצוה אף בשנותיו הראשונות, אחר שהעץ לא נזרע לשם הפירות, והאתרוג מותר גם באכילה אחר שאין בו דין ערלה. והוא שיהיה ניכר שהעץ ניטע לשם גדר וסייג, וכגון שנטעו במקום פירצה, או שמשפה את הענפים שיתעבו וכדו'. [ילקו''י הלכות ערלה פרק ט]."},"תרמח נה":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נה","text":"עץ תמר שניטע רק לצורך הלולבים למצות ארבעת המינים, התמרים שבו חייבים בערלה ובנטע רבעי. אבל הלולבים עצמם אין נוהג בהם דין ערלה, שאין דין ערלה אלא בפרי, ולכן מותר לקחת למצות ארבעת המינים לולב שידוע בבירור שהוא של ערלה. [ילקוט יוסף על הלכות ערלה פרק ט'. ילקוט יוסף על המועדים עמוד תרסז. חזון עובדיה סוכות עמוד שכ]."},"תרמח נו":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נו","text":"וכן אין נוהג דין ערלה בהדס ובענפי הערבה, ומותר לקחת הדס וערבה של ערלה למצות ארבעת המינים. [ילקוט יוסף על הלכות ערלה פרק ט'. ועל המועדים עמוד תרע. וחזו''ע שם]."},"תרמח נז":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נז","text":"אתרוג של שביעית כשר למצוה, אלא שאם הוא של שביעית יש לנהוג בו כל דיני קדושת שביעית, ואתרוג מן המשומר או הנעבד בשביעית, [שישראל עבד בקרקע שלא נמכרה לגוי בשביעית] יוצאים בו ידי חובת המצוה. [ילקוט יוסף על הלכות שביעית]."},"תרמח נח":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נח","text":"אתרוג שהיה על העץ בשנה הששית בגודל פול, ובשביעית גדל ונעשה ככד, ונלקט בשנה השביעית, אף שחייב במעשרות כפירות שנה ששית, מכל מקום הואיל ונלקט בשביעית הרי הוא כפירות שביעית, ונוהג בו קדושת שביעית. ויש אומרים שהולכים באתרוג אחר חנטה, ואם חנט בששית, דהיינו שהגיע לסמדר בששית, אין בו קדושת שביעית אף שנלקט בשביעית. וצריך לחוש לדעה הראשונה [שהיא דעת הרמב''ם], ולכן הולכים באתרוג גם אחר לקיטה, ועדיף לקטוף את האתרוג מהעץ בשנה הששית, ולא אחרי ראש השנה של השנה השביעית. שאם לא כן יצטרכו לשמור אותו בכל דיני שביעית. ובסוף שנת השמיטה יש לקטוף את האתרוג אחרי ראש השנה של שנה שמינית, ועם כל זה צריכים לשמרו בכל דיני שביעית. [ילקו''י השביעית והלכותיה עמוד תמח]."},"תרמח נט":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף נט","text":"ישראל שמכר את פרדס האתרוגים לגוי, בטרם תבוא שנת השמיטה, באמצעות הרבנות הראשית, ובשנה השביעית לא הפקיר פירות הפרדס, וגדר את הפרדס, ושמרו מכל משמר, וטיפל בו בהשקאה ועידור וכיו''ב במשך כל שנת השמיטה, (דהוי איסור מדרבנן בשדה של ישראל, עיין מ''ק ג.) אף על פי כן האתרוגים שלו כשרים למצוה, אפילו ביום טוב ראשון של חג, ומברכים עליהם ויוצאים בהם ידי חובת המצוה. [חזו''ע סוכות עמו' רפה. והנה דעת ר''ת פירות שביעית מן הנעבד אסורים באכילה. אך דעת הרמב''ן דמותרים באכילה. וי''א דעכ''פ מהני לגבי מצות אתרוג, דמצוות לאו ליהנות ניתנו. וא''כ הוי ס''ס במצוה, ואיכא חזקת חיוב ולכן יכול לברך על אתרוגים אלה. ואף שבילקו''י השביעית והלכותיה כתבנו בלשון שיש סמך גדול למקילין וכו', הנה להמבואר בחזו''ע הנ''ל יש להקל בזה טפי]."},"תרמח ס":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף ס","text":"אתרוגים שגדלו בפרדסים של ישראל בשנת השמיטה בארץ ישראל, והפרדסים נמכרו לגוי באמצעות הרבנות הראשית, אין בהם משום קדושת שביעית, ומותרים בסחורה, וכן מותר להוציאם לחו''ל למצות לולב, ולהסתחר בהם. [חזו''ע סוכות עמ' רפט]."},"תרמח סא":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף סא","text":"מותר למשמש בידיו באתרוג של שביעית, דאף שמפסיד הקליפה במשמוש הידים, אין בזה איסור, שהרי נטעו מתחילה אדעתא דהכי שהקליפה תהא נפסדת. ועוד, שרק הקליפה נפסדת, והפרי ראוי לאכילה, וממילא אין זה בכלל האיסור לאכלה ולא להפסד."},"תרמח סב":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף סב","text":"אתרוג שגדל בעציץ שאינו נקוב, אפשר לברך עליו, בין אם העציץ של חרס, בין אם העציץ של עץ. וכן הדין בעציץ שאינו נקוב של מתכת. ואם נופן יוצא לחוץ, יש להתיר בשופי. [ילקוט יוסף השביעית והלכותיה עמוד תנא, חזון עובדיה סוכות, עמוד שכו]"},"תרמח סג":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף סג","text":"אתרוג שהונח תחת המטה שישנים עליה, יש אומרים שאין לצאת בו ידי חובה ביום הראשון, מפני שרוח רעה שורה עליו, ואינו ראוי לאכילה, ולא קרינן ביה לכם, ויש חולקים ומתירים אותו גם לאכילה וגם למצוה. וכן עיקר. ובפרט אם הקרקע מרוצפת דכשר לכתחילה. אולם אם יש לו אתרוג אחר עדיף שיצא בו ידי חובתו, אבל אם אין לו אתרוג אחר יכול לצאת ידי חובה באתרוג זה, ויכול גם לברך עליו כדת. [ילקו''י מועדים עמוד קנח. יבי''א ח''א חיו''ד סי' ט. וח''ח חאו''ח סי' נא. חזו''ע סוכות עמ' ער. הליכות עולם. וע' בפסחים (קיב.) אוכלים ומשקים ששהו תחת המטה, אפי' מחופים בכלי ברזל, רוח רעה שורה עליהן. ולהרמב''ם הוא שמא יפול בו דבר המזיק. ובשו''ת שבות יעקב ח''ב (סי' קה) כתב, דבדיעבד מותרים. וכ''ד רעק''א, שם אריה, שו''ת בית שלמה, שו''ת עין יצחק, ועוד. אולם מרן החיד''א אוסר אף בדיעבד. וכ''ד הזבחי צדק, שו''ת בנין עולם, ועוד. ולגבי מצות אתרוג יש סברא דשומר מצוה לא ידע דבר רע. וכ''כ בשו''ת לב ים, ובשו''ת מהר''י הכהן, ובחלקת יעקב, ועוד]."},"תרמח סד":{"title":"סימן תרמח (דברים הפוסלים באתרוג), סעיף סד","text":"אתרוג שהחזיקו אותו בידים קודם נטילת ידים שחרית, בעוד רוח רעה שורה על הידים, אף על פי כן כשר למצות לולב. ועל צד היותר טוב, נכון שיערה עליו מים ג' פעמים, ואז חוזר לכשרותו, ומברך עליו ויוצא ידי חובתו. ואף ביום טוב יוכל לעשות כן. [חזון עובדיה סוכות עמוד עדר]."},"תרמט א":{"title":"סימן תרמט (דברים הפוסלים בארבעת מינים), סעיף א","text":"אף שכיום מצויים הרבה ערבות, ופעמים ואין בשני בדי ערבה שווי פרוטה, מכל מקום יוצאים בזה ידי חובה אפילו ביום הראשון, דשפיר קרינן ביה לכם, אף שאינו שוה פרוטה. ואמנם אם גזל ערבה אף שאין בה שוה פרוטה אינו יוצא ידי חובה. [ילקוט יוסף על המועדים, עמוד קנח. חזון עובדיה סוכות עמוד שיח]."},"תרמט ב":{"title":"סימן תרמט (דברים הפוסלים בארבעת מינים), סעיף ב","text":"יש אומרים שהקונה ערבה מעץ הגדל בקרקע של גוי, צריך להזהר שיקצצנו הוא בעצמו, ויקנה ממנו, אבל מנהגינו עתה שגם הישראל עצמו קוצץ הערבה מקרקע של גוי, ומביאה לכל מבקש. [ילקוט יוסף על המועדים, עמוד קנט]."},"תרמט ג":{"title":"סימן תרמט (דברים הפוסלים בארבעת מינים), סעיף ג","text":"לולב שאגדו גוי ועשאו, כשר. אך אין נכון לכתחלה לתת לגוי לאגוד את הלולב עם הערבה וההדס, שכיון שהאגד הוא נוי למצוה, חשיב כמו המצוה עצמה. [שם]"},"תרמט ד":{"title":"סימן תרמט (דברים הפוסלים בארבעת מינים), סעיף ד","text":"שני אנשים שהלכו יחדיו לקנות להם אתרוגים למצוה, ונזדמנו להם שני אתרוגים, האחד הוא כשר לכל הדעות, אבל אינו מהודר כמו השני, והשני יש בו מחלוקת הפוסקים אם הוא כשר למצותו, וההלכה היא שהוא כשר, והוא מהודר מאד, רשאי הוא לשבח ולפאר את האתרוג השני על יופיו והידורו שעל ידי כך יקחנו חבירו, [שבאמת הוא כשר להלכה], והוא יזכה לקחת את האתרוג הכשר לכל הדעות, ואין לחוש שעל ידי כך הוא מטעה את חבירו שלא יקח את האתרוג הכשר לכל הדעות. ואפילו אם חבירו השני הוא גביר נכבד מאד, ורודף צדקה וחסד, משום שאדם קרוב אצל עצמו, ואף במילי דשמיא אמרינן חייך קודמים. [ואף שאסור לרמות חבירו לקחת את שלו, זהו בדבר שבממון, אבל במצוות אף שאי אפשר ליקח מיד הזוכה, כגון כיסוי הדם ומילה וכיוצא, מכל מקום כל שלא זכה עדיין הם כמדבר המופקר לכל, וכל אדם נצטוה להשלים את נפשו ולזכות במצוות]. [חזו''ע סוכות עמוד רסב]."},"תרמט ה":{"title":"סימן תרמט (דברים הפוסלים בארבעת מינים), סעיף ה","text":"גביר שרוצה לקנות לולב מהודר עבור חכם, מותר להעלות בדמים כדי לזכות בו, דאף שהחכם גדול כבודו, אמנם במה שציונו ה' מצוה מן התורה אין חולקים כבוד לרב, שאדם קרוב אצל עצמו לעשות המצוה שציוהו ה' יותר מכל אדם אחר. ובכל דבר מצוה הוא קודם אפילו לאדם גדול ממנו. [חזון עובדיה סוכות עמוד רסג]."},"תרנ א":{"title":"סימן תרנ (שיעור הדס וערבה), סעיף א","text":"כבר נתבאר לעיל בסימן תרמו ס''ג, ששיעור אורך ההדס או הערבה ג' טפחים, דהיינו עשרים וארבע ס''מ. ויש מחמירים כשיטת החזון איש, ליקח הדס באורך שלושים ס''מ. ומעיקר הדין די ב-24 ס''מ. ומשערים בעץ הבד [הגבעול] ואין מצרפין את העלים שבראש הבד. [הריטב''א]. ובכלל ההידור להוסיף על שיעורו שלא יהיה בצמצום. [ויש להסתפק אם הבד מגולה למעלה או למטה אם מצטרף לשיעור ג' טפחים. ועיין בחזו''ע עמ' שי, ובילקו''י מועדים עמ' קנב]"},"תרנ ב":{"title":"סימן תרנ (שיעור הדס וערבה), סעיף ב","text":"אף על פי שיש מעלה בהדסים ארוכים יותר מהשיעור, מכל מקום היינו בתנאי שיצא משדרת הלולב למעלה מההדס והערבות שיעור טפח. [חזון עובדיה על סוכות, עמוד שנט]"}},"B":{"לולב 1":{"title":"לולב › 1. אורך הלולב","text":"אורך שדרתו של הלולב צריך להיות לפחות ארבעה טפחים. לשיטת הגר\"ח נאה: 33 ס\"מ, לשיטת החזו\"א: 40 ס\"מ. יש לשים לב שאין מדובר במידת אורכו של הלולב מקצה לקצה, אלא באורכה של שדרת הלולב, שצריך להיות ארבעה טפחים, לבד מן העלין היוצאים מהשדרה. יש להיזהר שבתוך שיעור ארבעת הטפחים, הלולב יהיה מכוסה בעלים משני צדדיו, מאחר שמקום המגולה ללא עלים אין שמו לולב אלא 'אופתא'. לכן בלולב שקצהו התחתון אינו מכוסה בעלים משני צדדיו, יש למדוד את ארבעת הטפחים של אורך השדרה רק מההתחלה של מקום יציאת העלים."},"לולב 2":{"title":"לולב › 2. נחלקה התיומת","text":"צורת גידולם של עלי הלולב כך היא: כשהם גדלים, גדלים שניים-שניים, כלומר, כל עלה מורכב משני עלים המחוברים בגבן זה לזה. גב (= חיבור) שני העלים נקרא 'תיומת'.\nנחלקו הפוסקים במקרה של לולב שנחלקה בו התיומת, האם הוא כשר או פסול.\nלדעת השו\"ע, כדי שהלולב ייפסל צריכים להתקיים שני תנאים: ראשית, שהתיומת חלוקה ופתוחה ברוב עלי הלולב, שנית, שהתיומת נפתחה ברוב אורכו של כל עלה ועלה. סוג פסול מעין זה הוא נדיר מאוד, ובדרך כלל לולב שנחלקה בו התיומת בכל העלים ובכל עלה ועלה, לא יגיע כלל לדוכני המכירה.\nלדעת הרמ\"א, מעיקר הדין אם נחלק העלה האמצעי שבלולב עד השדרה, הלולב פסול. סברת המחמירים היא שכאשר יש סדק קטן בעלה האמצעי, על ידי נענועי הלולב הוא ילך ויגדל עד שהתיומת תפתח לגמרי וייפסל הלולב.\nלכתחילה למצווה מן המובחר, נוהגים ליטול לולב שלא נחלק עלהו האמצעי כלל.\nבהסבר חומרת הרמ\"א נחלקו האחרונים:\nהט\"ז סבור שיש להחמיר רק במקרה שהתיומת נחלקה בשיעור של טפח. לעומתו, סובר ה'חיי אדם', שלדעת הרמ\"א יש להחמיר אפילו במשהו. לכן לכתחילה, יש עדיפות בברכה על לולב שהתיומת האמצעית שלו סגורה לגמרי, אף שמדינא אפשר לברך גם על לולב שנחלקה התיומת שלו, כל זמן שלא נחלק רובו של העלה."},"לולב 3":{"title":"לולב › 3. מקרים נוספים","text":"בלולבים שיש בהם שני עלים אמצעיים (ולא עלה אמצעי אחד בלבד), המשנ\"ב פסק כדעת הב\"ח, שלכל עלה יש דין תיומת בפני עצמו, ואם נחלקה אחת מהם, הלולב פסול.\nשכיח מאוד למצוא לולב שבו העלה האמצעי אינו כפול לכל אורכו ומסתיים בגובה שווה, אלא צד אחד של העלה נמוך מעט מחברו. הפוסקים האחרונים הכריעו שמעיקר הדין, אם עלה אחד מכסה את רובו של העלה השני, הלולב כשר. אף על פי כן לחומרא, יש שכתבו שאם ההפרש ניכר לעין כאשר מסתכלים על הלולב ממרחק נטילה, יש להעדיף ליטול לולב אחר; אך יש שלא החמירו בכך כלל."},"לולב 4":{"title":"לולב › 4. קור\"א (לולב המכוסה בקליפה אדומה)","text":"בדברי הראשונים לא מצאנו שכתבו על לולב זה, אך הבית יוסף כותב:\nולפי מה שמצא ר\"י בתשובת הגאונים, צריך ששני הוצין אלו יהיו דבוקים ממש בלי שום פירוד כאילו הם גוף אחד, וזה דבר שאינו נמצא בארצם, אבל אצלנו נמצא הרבה פעמים כמין דבר אדום בלולב מצד פניו, שהוא מחבר שני הוצים אלו ונראה כל ראש הלולב כאילו הוא עץ אחד בלי שום פירוד.\nמלשון הבית יוסף, משמע שלולב זה הוא מהודר מאוד, וכך נהגו רבים מבני עדות המזרח, ליטול דווקא לולב עם קור\"א.\nיש מהאשכנזים שנהגו גם כן ליטול לולב זה, ולא חששו שמא התיומת אינה סגורה לחלוטין, אך יש שהחמירו לקחת לולב ללא קור\"א, בגלל שתי סיבות:\nא. כיוון שהקור\"א מכסה את התיומת, לא ניתן לראות האם התיומת סגורה לגמרי.\nב. האשכנזים פסקו כדעת הריטב\"א, שנענוע הלולב הוא כסכוס העלים, ולא כדעת הגאונים, שהנענוע הוא הולכה והבאה של הלולב. בלולב עם קור\"א העלים מאוגדים יחד ואי אפשר לכסכס בהם14.\nלמעשה: הספרדים נהגו להדר וליטול לולב עם קור\"א. לאשכנזים, יש להעדיף לולב שתיומתו סגורה לגמרי, ללא קור\"א."},"לולב 5":{"title":"לולב › 5. נסדק ראשו ('הימניק')","text":"לולב שנסדק ראשו (בלשון הגמרא: 'נעשה כהימניק') פסול. רש\"י ביאר, שהלולב נעשה כעין ברזל של סופרים שיש לו שני ראשים - ראשו האחד מפוצל, לאמור ראש הלולב נראה כעין צורת V.\nכיוון שפסול זה מצוי מאוד, יש צורך לבאר היטב מהו ההבדל בין מקרה שנחלקה התיומת, שבו מעיקר הדין הלולב כשר כל זמן שלא נחלק רוב העלה האמצעי, לבין מקרה של לולב שנסדק, שפסול בכל אופן.\nרוב הפוסקים הכריעו כדעת המהרש\"ם, שפסול 'הימניק' משמעותו שנתרחקו סדקיו זה מזה היטב, עד שנראים שני ראשי העלים כמין מזלג בעל שתי שיניים, אך אם העלה האמצעי רק נסדק מעט, אף שנראה בבירור החלל שבין שני העלים, הלולב כשר. כיוון שכאשר מונח הלולב על השולחן או כאשר מנענעים בו נוגעים העלים זה בזה, אין זה בכלל 'הימניק', ולכן הלולב כשר כל זמן שלא נחלק רובו של העלה.\nלעומתם, יש פוסקים ספרדים הסוברים שלדעת השו\"ע, הלולב פסול דווקא אם רוב העלים נסדקו, אבל אם נסדק רק העלה האמצעי, הלולב כשר. כנגדם, יש פוסקים ספרדים הסוברים שגם לדעת השו\"ע, אם נסדק רק העלה האמצעי, הלולב פסול."},"לולב 6":{"title":"לולב › 6. נקטם ראשו של לולב","text":"מדינא דגמרא, נקטם ראשו של לולב - פסול.\nהשולחן ערוך מסביר כי 'נקטם ראשו, דהיינו שנקטמו רוב העלין העליונים, פסול'.\nיש שהבינו מלשון השו\"ע, שהכוונה שנחתכו רוב העלים הגבוהים מן השדרה. אחרים הבינו, שהשו\"ע עוסק בלולב שתיומתו מסתיימת בשני עלים אמצעיים, ולכן דבר על 'רוב עלין עליונים', אך בלולב המסתיים בשלושה עלים, גם לדעת השו\"ע, אם נקטם העלה האמצעי, הלולב פסול. הרמ\"א חלק על דברי המחבר, וכתב כי, 'אם נקטם העלה העליון האמצעי שעל השדרה, פסול'. לדעה שהמחבר לא דיבר על רוב העלים העליונים, אלא גם הוא מודה שלולב המסתיים בשלושה עלים ונקטם בו העלה האמצעי - פסול, אין כלל מחלוקת בין הרמ\"א לבין השו\"ע בדין זה.\nהאחרונים דנו מהו שיעור הקטימה הפוסל בלולב.\nהמשנ\"ב כתב, שפסול 'קטום' הוא משום פסול 'הדר', ופסולים אלו תלויים לפי מראית עיני רוב בני האדם בראייה שטחית. בשל כך, יש שכתבו שיש להחזיק את הלולב במרחק שאוחזו בשעת הנטילה (בערך כ- 35 ס\"מ), ולהתבונן על הלולב. אם הקטימה נראית לעין, הלולב פסול, אך אם הקטימה אינה נראית לעין, הלולב כשר לנטילה. ויש שחולקים וסוברים שאפילו אם נקטם כל שהוא פסול.\nהאחרונים דנים בלולב שמהתיומת האמצעית שלו יוצא כמין קוץ (מעין שערה דקה), אם כאשר נקטם ונפל הקוץ יש ללולב דין 'קטום' או לא. יש שהכריעו שלקוץ אין כלל דין עלה, ואם נקטם, אין הלולב נפסל. מנגד יש חולקים וסוברים שלקוץ יש דין עלה, ואם נקטם הקוץ יש לקחת לולב אחר."},"לולב 7":{"title":"לולב › 7. כווץ","text":"בשולחן ערוך נפסק שלולב כווץ פסול. השו\"ע דן במום שנוצר בלולב בשעת הגידול, כאשר עלי הלולב או גופו מתכווצים ונוצרים בהם מעין קמטים. דבר זה מצוי בלולבים רבים מאוד, שבראש התיומת ובעלים שבצדדיו נוצרו קמטים קטנים וצפופים, אין זה בכלל 'כווץ', ולולב זה כשר לכתחילה."},"לולב 8":{"title":"לולב › 8. עקום","text":"לולב ששדרתו התעקמה כלפי אחד הצדדים או לפניו, הלולב פסול. אם התעקמה השדרה לאחוריו, הלולב כשר. מעיקר הדין, הלולב פסול רק אם התעקם כמגל, אבל אם התעקם רק במקצת, לא נפסל הלולב בשל כך.\nבוודאי שלכתחילה עדיף לקחת לולב שלא ניכרת בו כלל עקמומיות. אין צורך להשכיב את הלולב במאוזן אל מול העין ולבדוק אותו, אלא יש להעמיד את הלולב בצורה מאונכת במרחק נטילה, ולראות האם ניכרת העקמומיות.\nלולב עקום שנפסל מחמת עקמומיותו, ניתן ליישרו בצורה מיוחדת, ולהחזירו להכשרו."},"לולב 9":{"title":"לולב › 9. כפוף","text":"לולב הכפוף כאגמון פסול, בין אם כפוף לאחוריו בין אם כפוף לפניו. לדעת השולחן ערוך, הכפיפות הפוסלת היא דווקא כאשר הלולב כפוף בשדרתו, אבל אם כפוף רק בעליו, אין בכך פסול. אדרבה, הרא\"ש כתב  'אוהב אני יותר לצאת בו (= בלולב שרק עליו כפופין ואילו שדרתו ישרה), שאין העלין נחלקין ותיומתו קיימת'. אך ה'לבוש' כתב, שכאשר עליו כפופין, הלולב אינו פסול, אלא אם העלה העליון לבדו כפוף; אך אם כל העלים העליונים או רובם כפופים, אין לצאת בו. המג\"א העתיקו, אך הט\"ז כתב שאין לחלק בכך, ומכל מקום אם יש לו לולב אחר, בוודאי עליו להיזהר שלא לצאת בלולב שרוב עליו כפופין.\nלכן, לכתחילה יש להעדיף לקחת לולב שאין עליו כפופים כלל. יש שכתבו שכאשר הכיפוף הוא מעט לצד ואינו כאגמון, אין לחוש לכך כלל, ואדרבה, יש עדיפות ליטול לולב שכפוף מעט, כיון שהכיפוף מחזק את התיומת ומשאירה סגורה."},"אתרוג 1":{"title":"אתרוג › 1. חסר","text":"אתרוג חסר פסול. הפוסקים נחלקו, האם יש שיעור לחיסרון הפוסל או שאפילו חיסרון כלשהו פוסל את האתרוג. למעשה יש להחמיר בכך, ואפילו חיסרון כלשהו פוסל.\nהגדרת 'חסר': האתרוג מורכב משלוש קליפות, קליפה חיצונית ירוקה דקה מאוד. תחתיה יש קליפה עבה (באכילתה מורגש מעט טעם של חריפות), ומתחתיה מתחיל בשר האתרוג הלבן. לרוב הפוסקים, אם החוסר הוא מהקליפה החיצונית אך עדין נותר מראהו הירוק של האתרוג, אין זה בכלל 'חסר', ורק אם על ידי החיסרון התגלה הלובן הפנימי של האתרוג, יש בו דין 'חסר', ופסול. החיסרון האוסר הוא דווקא חיסרון הנראה לעין כשאוחז את האתרוג בידו. חיסרון הנראה רק על ידי עיון ומבט מעמיק, אינו פוסל.\nלאור הדברים שכתבנו, ברור שמוהַל היוצא מן האתרוג על ידי לחיצה, אינו מורה על בעיית חסר. נקבים שנוצרו באתרוג על ידי קוצים בשעה שעוד היה על העץ, אינם פוסלים את האתרוג, כיוון שזוהי דרך גדילתו של האתרוג. דבר זה נכון רק כאשר נקרם עליו עור ובשר מלמעלה, אך אם רואה שאין העור והבשר קיימים בתוך הנקב, האתרוג פסול."},"אתרוג 2":{"title":"אתרוג › 2. ניטל דדו","text":"בראש האתרוג הגדל קיים פיטם. הפיטם עשוי מדד – עץ התחוב בתוך האתרוג ויוצא למעלה ממנו. בראש הדד עומדת השושנתא.\nאתרוג שניטל ממנו כל הפיטם ונוצרה בו גומה, פסול. אם נחתך הדד בדיוק בראש האתרוג ולא נוצרה בו גומה, דעת הט\"ז להקל, אך יש פוסקים שהחמירו בכך, ולמעשה ביום הראשון יש להחמיר.\nאם נשבר רק חלק מהעץ ונשאר מעט עץ למעלה מן האתרוג, לדעת המג\"א אין להחמיר בכך, אך למעשה, טוב להדר ולקחת אתרוג אחר. לכתחילה יש להעדיף לקחת אתרוג שלא נפלה לו אפילו השושנתא.\nכל האמור לעיל הוא דווקא באתרוגים שבדרך בריאתם וצורת גידולם היו להם דד ושושנתא, ורק אחר שנקטפו מהעץ נפל להם הדד. באתרוגים רבים כלל לא מצוי דד בשעה שקוטפים אותם, כיון שהדד נופל מהאתרוג עוד בעודו על עץ, וגם אתרוגים אלו נחשבים מהודרים לכל דבר.\nהערה: האמור לעיל נאמר דווקא על אתרוגים שהדד שלהם הוא כמין עץ. אם הדד הוא חלק מן האתרוג עצמו, ונחסר בו כלשהו, האתרוג פסול לכולי עלמא מדין 'חסר'."},"אתרוג 3":{"title":"אתרוג › 3. ניטל העוקץ","text":"העוקץ הוא העץ שבו תלוי האתרוג באילן. אם ניטל עוקצו של האתרוג ונוצרה בו גומה, האתרוג פסול. אם ניטל העוקץ אך מקום הגומה נשאר מכוסה, האתרוג כשר."},"אתרוג 4":{"title":"אתרוג › 4. שינוי מראה","text":"בדיון לגבי שינוי מראה, יש להפריד בין שני חלקי האתרוג: חוטמו של האתרוג לעומת שאר האתרוג. חוטמו של אתרוג הוא מהמקום שבו מתחיל האתרוג להיות משופע כלפי ראשו ועד דדו של האתרוג. מבחינה הלכתית, קיים הבדל גדול בין שינוי מראה בחוטמו של אתרוג לבין שינוי מראה בשאר האתרוג. בחוטמו של אתרוג, שינוי מראה פוסל במשהו. בשאר האתרוג, שינוי מראה פוסל כשהוא קיים בשניים או בשלושה מקומות, ודווקא כאשר נקודות אלו אינן באותו צד, ואם נעביר קו דמיוני המחבר את כל הנקודות, רוב שטחו של אתרוג יהיה מוקף.\nשינוי מראה על גבי הפיטם או בעוקץ, המנהג הוא שאינו אוסרו.\nשינוי המראה האוסר הוא כל נקודה שחורה או לבנה שלא ניתן להסירה מגוף האתרוג. מראה חום אינו אוסר. המראה האוסר הוא דווקא כאשר מסתכלים על האתרוג כדרך שנוטלים אותו, ללא עיון מעמיק. מראה שחור הנראה רק אחר עיון, אינו נחשב לשינוי מראה, והאתרוג כשר.\nחזזית היא מעין אבעבועות הנובעות מעיפוש האתרוג, ודינה כדין שינוי מראה. החזזית האוסרת היא דווקא חזזית הניכרת במישוש היד, אך אם חזזית אינה גבוהה ואינה בולטת מגוף האתרוג, ואינה ניכרת במישוש היד, היא אינה אוסרת.\nה'בלעטלאך' דומה לחזזית, אך בדרך כלל אינו אוסר. 'בלעטלאך' נוצר בשעת הגידול, מעלה ששפשף את האתרוג. כאשר ה'בלעטלאך' בולט מגופו של אתרוג, יש להחמיר ולקחת אתרוג אחר."},"אתרוג 5":{"title":"אתרוג › 5. צבע האתרוג","text":"אתרוג שצבעו ירוק כעשבי השדה ואינו עתיד להצהיב - פסול.\nאתרוג שעתיד להצהיב כשר, אפילו בשעה שהוא ירוק כעשבי השדה. לכתחילה טוב לקחת אתרוג שהתחיל להצהיב קצת.\nדעת הב\"ח שיש להחמיר שלא לקחת אתרוג שצבעו ירוק, גם אם עתיד להצהיב, משום שבאתרוג ירוק יש פסול של הדר. למעשה, מנהג העולם שלא להחמיר ואין חוששים לדעת הב\"ח.\nמובא בשם הגרי\"ש אלישיב זצ\"ל, שכיום אין אתרוגים שצבעם ירוק כעשבי השדה שפסולים, כיוון שבסופו של דבר, כולם מצהיבים."},"הדס 1":{"title":"הדס › 1. שיעורו","text":"שיעורו המינימלי של ההדס הוא שלושה טפחים (לדעת החזו\"א: 30 ס\"מ, לדעת הגר\"ח נאה: 24 ס\"מ).\nאף ששיעור זה מודד את מקומם של עלי ההדס, יש למדוד את הענף ולא את העלים. לדוגמה, אם עלי ההדס עולים למעלה מן הענף, מדידת שיעור ההדס תהיה בגופו של הענף ולא תתחשב בעלים הגבוהים יותר. להדס אין שיעור מקסימלי, ומכל מקום, בשעת הנטילה צריך ששדרתו של הלולב תהיה גבוהה בשיעור של טפח לפחות, יותר מן ההדסים והערבות."},"הדס 2":{"title":"הדס › 2. שיהיה עבות","text":"מבנה ההדס: ההדס הוא ענף שלכל אורכו יוצאים עלים השוכבים על הענף. מכל קן - שורת גובה אחת, יוצאים שלושה עלי הדס, וכל עלה מכסה ברוחבו את העלים שמצדדיו. כל עלה יוצא מעוקץ נפרד. העלים בגובהם מכסים את כל אורך הענף, עד שלא נשאר בו מקום מגולה. ההדס הכשר הוא הדס שבכל קן וקן עומדים שלושת העלים זה כנגד זה בשווה. הדס זה נקרא 'עבות'. 'הדס שוטה' הוא הדס ששלושת העלים בכל קן אינם נמצאים בקו שווה. לדוגמא, אם היו שני עלים בשווה זה כנגד זה, והעלה השלישי יוצא מעט גבוה מהם, אין זה עבות, אלא הדס שוטה, ופסול.\nלכתחילה, יש לקחת הדס שכולו עבות, כלומר שמכל קן בהדס יהיו שלושה עלים באותו גובה. אך אם אין כולו עבות אלא רובו, די בכך להכשירו. הדס שרובו עבות כשר, אפילו כאשר הרוב מקוטע ואינו ברצף.\nהדס הארוך מהשיעור המינימלי (שלושה טפחים), כל זמן שיש רוב שיעור (טפח וחצי וקצת) שהוא עבות, ההדס כשר. בהדס ארוך מהשיעור, שיש בו טפח וחצי וקצת  שהוא עבות (רוב השיעור המינימלי), אך רוב ההדס אינו עבות, יש אומרים שרוב העבות צריך להיות רצוף ולא למקוטעים.\nהדס שמלכתחילה היו לו שלושה עלים בכל קן, ואחר זמן נשר מכל קן עלה אחד, נחלקו הפוסקים האם הדס זה נקרא עבות או שוטה. למעשה, יש להחמיר שלא לקחתו אלא בשעת הדחק."},"הדס 3":{"title":"הדס › 3. נקטם ראשו","text":"נקטם ראשו של ההדס, לרוב הדעות פסול ויש לקחת הדס אחר.\nהקטימה הפוסלת היא דווקא בעץ ולא בעלים. לכן, אף על פי שנשרו העלים בראש ההדס ונשאר ראש העץ ערום, ההדס כשר, ובלבד שנשאר ברוב שיעורו עבות (בכל קן שלושה עלים)."},"ערבה 1":{"title":"ערבה › 1. שיעורה","text":"שיעורה המינימאלי של הערבה הוא שלושה טפחים (לדעת החזו\"א: 30 ס\"מ, לדעת הגר\"ח נאה: 24 ס\"מ).\nלערבה אין שיעור מקסימאלי, ומכל מקום צריך שבשעת הנטילה תהיה שדרתו של הלולב גבוהה בשיעור של טפח לפחות יותר מן הערבות."},"ערבה 2":{"title":"ערבה › 2. מקום גידולה","text":"רוב מיני הערבות גדלים על הנחלים, ולכן נקרא שמן 'ערבי נחל', אך גם ערבה הגדלה במקומות אחרים ולא על הנחל כשרה. יש שכתבו, שלכתחילה יש להעדיף לקחת ערבה הגדלה על נחל, ויש שכתבו שאין להחמיר בכך כלל. למעשה, המנהג שלא להחמיר בכך, ואפשר לקחת ערבה מכל מקום, ובלבד שיהיו בה את סימני הכשרות של הערבה."},"ערבה 3":{"title":"ערבה › 3. סימני הכשרות של הערבה","text":"1. עלה הערבה משוך כנחל ואינו עגול.\n2. קצה העלים (מסגרת העלה) חלק, או שיש בו פגימות קטנטנות.\n3. קנה הערבה אדום, וכל שאינו לבן נקרא אדום, כיוון שאף שעכשיו הקנה ירוק, כאשר השמש תכה בו הוא יהיה אדום ."},"ערבה 4":{"title":"ערבה › 4. נשרו העלים","text":"ערבה שנשרו רוב עליה בשיעור שלושה טפחים, פסולה. אם נדלדלו עליה מהקנה או שנסדקו העלים או שנחלקו, כתב הרב המגיד, שזה נקרא 'נפרצו עליה', והערבה פסולה, ודווקא כאשר היה כן ברוב העלים. וכתב המגן אברהם, שכיוון שערבות מצויות בינינו יש להחמיר בכך. אם חסר מכל עלה רק מקצתו, כשרה, אבל אם חסר רוב העלה, וכך הוא ברוב עלי הערבה, הערבה פסולה."},"ערבה 5":{"title":"ערבה › 5. נקטם ראשה","text":"נקטם ראש עץ הערבה, פסולה. אם נקטמו העלים, אפילו העלה שבראש הערבה, כשרה. והוא הדין אם נקטם העלה הנקרא 'לבלוב', גם כן אין בכך פסול בערבה. יש הנוהגים לקחת ערבה שבראשה יש לבלוב, משום שעלה זה מוכיח ללא כל ספק, שלא נקטם העץ של הערבה, ומכל מקום אין זה מדינא, ובכל מקרה שניכר בבירור שלא נקטם העץ, הערבה כשרה."}},"C":{"לולב":{"title":"מנהג חב\"ד › לולב","text":"הסתכל בראש הלולב ובחר לולב שנראה סגור בראשו (רבותינו נשיאינו נהגו לקחת לולב שעליו מחוברים עם \"קורא\"), שעליו אינם מכופפים בראשם (\"קנעפלאך\"), וישר [שמתבוננים על שדרת הלולב, שאינה מתעקלת]\nעקוב אחר העלה האמצעי (השדרה)\nהאם הוא סגור?\nסגור — כשר\nפתוח, רוב העלה האמצעי פתוח — פסול ליום הראשון\nפתוח, רוב העלה האמצעי סגור — כשר רק באין לולב אחר\n* שים לב ששדרת הלולב תהיה גבוהה מההדסים והערבות ב-8 ס\"מ לפחות"},"הדס":{"title":"מנהג חב\"ד › הדס","text":"קנייה בשקית עם הכשר\nבחר בהכשר מקובל, והדסים שכתוב עליהם \"כולו משולש\" (לא \"רובו\", בדיעבד גם \"רובו\" כשר). אורך השיעור הכשר בהדסים, צריך להיות לפחות 24 ס\"מ (כשיעור הגר\"ח נאה)\nבדיקה עצמאית\nבדוק (מחלקו העליון של ההדס) האם העלים יוצאים באותו גובה ושההדס לא קטום מלמעלה\nאם יש 24 ס\"מ כאלו - כשר ומהודר. אם רוב הקנים משולשים כשר (אך לכתחילה יש לקחת משולש בשיעור המלא של 24 ס\"מ)"},"ערבה":{"title":"מנהג חב\"ד › ערבה","text":"יש לקנות בשקית עם הכשר, או מאדם שניתן לסמוך עליו, שאין חשש גזל (שלא נקטפה משטח כלשהו, בלי לבקש רשות)\nוודא שהערבה: 1. עם קנה אדום, 2. העלה משוך כנחל, 3. בלי פגימות בולטות, 4. לא קטומה למעלה\nבדוק שהעלים קיימים על הערבה (לשים לב לכך גם במהלך החג ולהחליף במקרה הצורך)\nקיים סוג של ערבה שהענף ירוק ואח\"כ הופך לאדום, אך היות ולא תמיד ניתן להבחין האם אכן זו ערבה כזו, מומלץ כשבוחרים לבד, לקחת ענף אדום דווקא"},"אתרוג":{"title":"מנהג חב\"ד › אתרוג","text":"בדוק שיש הכשר שהאתרוג \"בלתי מורכב\". מנהגנו, להדר ולברך על אתרוג מקאלבריא, וצריכה להיות השגחה אמינה שאינו מורכב. באם אין קאלבריא יש לקחת מאתרוגי כפר חב\"ד שהם מזרע אתרוגי קאלבריא כך שאינם בחשש מורכבים.\nקח אתרוג הנאה בעיניך בצורתו ובמראהו (הרבי מה\"מ בחר בדרך כלל בצורה המזכירה מגדל), למנהגנו יש לדאוג שיהיה צהוב ולא ירוק.\nהסתכל (באור טוב) על האתרוג ממרחק של כ-40-50 ס\"מ, וסובב אותו לאט לאט סיבוב שלם (כדאי לעשות סיבוב אחד ולהסתכל בחוטם, ואח\"כ לעשות סיבוב נוסף ולהסתכל בחלק התחתון)\nלא נראתה נקודה שחורה (או נוטה לשחור) או לבנה מאוד — כשר (אף אם במבט קרוב רואים נקודה, ואחרי ההתבוננות בה תיראה גם מרחוק)\nנראתה נקודה שחורה או לבנה, בחלק העליון (ממקום השיפוע) — פסול\nנראתה נקודה שחורה או לבנה, בחלק התחתון, נקודה אחת — כשר\nנראתה נקודה שחורה או לבנה, בחלק התחתון, שתי נקודות — אם זה נראה מנומר באופן בולט, גם אם זה במיעוט האתרוג, זה עלול להיות פסול ולכן מומלץ להראות לרב מורה הוראה\n* נקודות הנמצאות בתחתית האתרוג, מסביב לעוקץ, לדעת רוב הפוסקים אינן מעכבות."},"פרטים נוספים":{"title":"מנהג חב\"ד › פרטים נוספים","text":"א. לעיתים יש כתם של עלה - 'בלעטלאך' וזה כשר, אך יש מקום להדר באתרוג נקי מכל.\nב. אם רואים נקב או שיש חשש לנקב - אין לקנות.\nג. הקונה אתרוג עם פיטם, צריך להזהר שהפיטם לא יפול, והוא בנוגע ל'עוקץ', במקרה שנפל, יש בזה כמה פרטים ויש לברר עם רב מורה הוראה.\nד. הקונה אתרוג בלי פיטם, יש לוודא שאכן נקטף כך, ולא נשר בדרך או אצל הסוחר, אם יש ספק, להראות למי שמומחה בכך."},"הערה":{"title":"מנהג חב\"ד › הערה","text":"* תרשים זה, נועד לסייע במידע ראשוני וכללי בלבד לרוכשי ד' מינים, לפירוט נוסף ראה במדריך ההלכתי של 'מכון הלכה חב\"ד'\nהגהה: הגה\"ח הרב מיכאל אבישיד, רב קהילת חב\"ד בית שמש, הגה\"ח הרב שלמה הלפרן, רב קהילת חב\"ד תל אביב, הגה\"ח הרב משה קורנווייץ, רב קהילת חב\"ד הר יונה\nתרשים זה אינו מהווה תחליף ללימוד בספרי ההלכה, ולפסק דין ע\"י רב מורה הוראה!"}}};
